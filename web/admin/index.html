<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Deployed with the site on every tier, and reachable on none of them without
     an Access login. Kept out of search results rather than kept out of the
     deploy: a page that is only in some builds is a page that is broken in the
     build nobody tested. -->
<meta name="robots" content="noindex">
<title>guessr — day preview</title>
<script src="/theme.js"></script>
<link rel="stylesheet" href="/leaflet/leaflet.css">
<link rel="stylesheet" href="/base.css">
<style>
  /* Only what a review page needs on top of the shared sheet: a column to read
     in, a clip grid, and the two colours that say something is wrong. */
  body { margin: 0 auto; padding: 1rem; max-width: 60rem; }
  h1 { font-size: 1.3rem; font-weight: 400; font-style: italic; }
  .nav { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  #meta, #queue { color: var(--color-muted); }
  /* Directly above the first Reject button, because it is the price list for
     pressing one. */
  #queue { margin: 0 0 .5rem; }
  ol { list-style: none; padding: 0; display: grid; gap: 1rem; }
  li { display: flex; gap: 1rem; align-items: flex-start; flex-wrap: wrap; }
  /* Wide enough to judge a clip by, narrow enough that five fit on a screen. */
  video { width: 20rem; max-width: 100%; background: #000; border-radius: 4px; }
  li p { margin: 0 0 .25rem; }
  .dim { color: var(--color-muted); font-size: .85rem; font-family: ui-monospace, monospace; }
  /* Red carries "wrong" on its own, so it stays red in both themes -- but #b00
     on the dark ground is nearly unreadable, hence the lighter pair. The second
     of the two is the one state a reviewer must not misread: this day is in
     front of players right now and cannot be edited. */
  .warn, #meta.live { color: #b00; font-weight: bold; }
  [data-theme='dark'] .warn, [data-theme='dark'] #meta.live { color: #ff6b6b; }
  /* Every round with an answer, so the page says where the game draws from
     rather than naming a state per clip and leaving the shape to be imagined. */
  #map { height: 20rem; margin: 1rem 0 .3rem; border: 1px solid var(--color-border);
         border-radius: 4px; background: var(--color-bg); }
  #legend { display: flex; gap: 1rem; flex-wrap: wrap; margin: 0 0 1rem; }
  #legend .swatch { display: inline-block; width: .6rem; height: .6rem;
                    border-radius: 50%; margin-right: .35em; }
</style>
</head>
<body>
<h1>Day preview</h1>
<p class="nav">
  <button id="prev" class="secondary" type="button">&larr;</button>
  <input type="date" id="date">
  <button id="next" class="secondary" type="button">&rarr;</button>
  <span id="meta"></span>
</p>
<div id="map"></div>
<p id="legend" class="dim"></p>
<p id="queue"></p>
<ol id="rounds"></ol>

<script src="/leaflet/leaflet.js"></script>

<script type="module">
// The viewer half of the admin surface: pick a date, watch its five clips, check
// each answer against what the clip shows. Everything it knows comes from
// /admin/day, which is where both gates live -- so where the surface is closed
// this page renders and then reports what the endpoint told it, rather than
// being a second thing that has to agree about who may look.

// The play-window rule, imported rather than restated: the endpoint refuses a
// day that has opened, and a second copy of "has it opened" here would be a
// second thing to keep in step with it.
import { playWindow } from '/daily.js';

const el = id => document.getElementById(id);

// UTC throughout, because a date is what the schedule is keyed on and the local
// calendar date is a different question. <input type="date"> is native and needs
// no picker library; it hands back the YYYY-MM-DD the endpoint wants.
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
const shift = (date, days) => {
  const d = new Date(`${date}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return iso(d);
};

// The values below are this project's own rows, but they reach the DOM as markup
// and one of them is a filename from a generator -- so escape rather than trust
// the provenance of a string forever.
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Zoom 17 lands on the street rather than the county, which is the whole point:
// the answers are metres wide now, so "is this pin on the road in the clip" is a
// question you can only ask at street zoom.
const osm = r =>
  `https://www.openstreetmap.org/?mlat=${r.lat}&mlon=${r.lng}#map=17/${r.lat}/${r.lng}`;

// The pool as a map, which is the question a list of state names is a proxy
// for: whether the set the game draws from is one interstate leg or actually
// spans the trip. Same vendored Leaflet and same tiles as the game.
const map = L.map('map', { worldCopyJump: false });
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '&copy; OpenStreetMap'
}).addTo(map);

// Status is the read: what is placed, what is spare, what was thrown out. Fixed
// colours rather than the palette — they sit on map tiles, which do not change
// with the theme. Green is the game's own answer-pin colour, kept for the day
// being reviewed.
const STATUS = { scheduled: '#0369a1', queued: '#888', rejected: '#b00' };
const TODAY = '#4ade80';

// A key for the pins, not a tally of the pool. Every pin is a round that has an
// answer row, because a round with no coordinates cannot be drawn -- so a count
// taken from them runs short by however many rounds were pushed without their
// answers, which is the failure this page exists to catch. The swatches say what
// a colour means and leave the counting to whatever reads the rounds table.
//
// Green is in the key too: it is the largest and most prominent thing on the map,
// so a key without it is one that explains everything except what the reviewer is
// looking at.
el('legend').innerHTML = Object.entries({ ...STATUS, 'this day': TODAY })
  .map(([label, colour]) =>
    `<span><span class="swatch" style="background:${colour}"></span>${label}</span>`)
  .join('');

const pins = L.layerGroup().addTo(map);
// Fitted once. The pool is the same whichever date is being reviewed, so
// refitting on every step would throw away a zoom the reviewer chose.
let fitted = false;

function drawMap(pool, rounds) {
  pins.clearLayers();
  for (const p of pool) {
    L.circleMarker([p.lat, p.lng],
      { radius: 3, weight: 1, color: STATUS[p.status] ?? '#888', fillOpacity: .6 })
      .addTo(pins);
  }
  // On top and larger, so stepping through days shows where each one sits in
  // the pool rather than just that the pool exists.
  for (const r of rounds) {
    if (r.lat == null) continue;
    L.circleMarker([r.lat, r.lng], { radius: 7, weight: 2, color: TODAY, fillOpacity: .9 })
      .bindTooltip(`#${r.position}`)
      .addTo(pins);
  }

  if (!fitted && pool.length) {
    map.fitBounds(L.latLngBounds(pool.map(p => [p.lat, p.lng])), { padding: [20, 20] });
    fitted = true;
  }
}

function answer(r) {
  // A scheduled round with no answer row: a rounds push whose answers push never
  // happened. Called out loudly because the game's own symptom for it is every
  // guess that day failing, long after the deploy went green.
  if (r.lat == null) {
    return '<span class="warn">no answer row — answers.sql was never pushed for this round</span>';
  }
  return `<a href="${osm(r)}" target="_blank" rel="noreferrer">`
    + `${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}</a> &plusmn;${Math.round(r.radius_m)} m`;
}

// Only on a day nothing can have played yet. The endpoint enforces this itself
// and is the authority; the button reads the same rule from the same module so
// it does not offer an action that is going to come back 409. `opens` rather
// than isOpen(), because a finished day is past editing too.
const editable = date => Date.now() < playWindow(date).opens;

function render(r, date) {
  return `<li>
    <video src="/${esc(r.image)}" controls muted loop playsinline preload="metadata"></video>
    <div>
      <p><b>#${r.position}</b> — ${esc(r.state ?? '—')}, ${esc(r.filmed ?? '—')}</p>
      <p>${answer(r)}</p>
      <p class="dim">locatability ${r.median_km.toFixed(1)} km</p>
      <p class="dim">${esc(r.slug)} @ ${r.source_ts_sec.toFixed(1)}s</p>
      ${editable(date)
        ? `<button type="button" class="reject" data-image="${esc(r.image)}">Reject</button>`
        : ''}
    </div>
  </li>`;
}

const hours = ms => (ms < 3600000 ? `${Math.round(ms / 60000)}m` : `${Math.round(ms / 3600000)}h`);

// Three states, and what a reviewer needs from each is whether the day can still
// be changed: upcoming says how long the Reject button has left, LIVE says the
// schedule is frozen and a problem here is already in front of players, finished
// says it is history.
function when(date) {
  const { opens, closes } = playWindow(date);
  const now = Date.now();
  if (now < opens) return `upcoming — opens in ${hours(opens - now)}, editable until then`;
  if (now >= closes) return `finished — closed ${hours(now - closes)} ago`;
  return `LIVE — closes in ${hours(closes - now)} · frozen`;
}

async function show(date) {
  el('date').value = date;
  // In the URL so a day is linkable -- replaceState rather than pushState, since
  // stepping through a week should not need a week of Back presses to leave.
  history.replaceState(null, '', `?date=${date}`);
  el('rounds').innerHTML = '';
  // Cleared with them, so a date that comes back 404 does not leave the previous
  // day's numbers sitting above an empty list as if they described it.
  el('queue').textContent = '';
  el('meta').textContent = 'loading…';

  let res, body;
  try {
    res = await fetch(`/admin/day?date=${date}`);
    body = await res.json();
  } catch {
    el('meta').textContent = 'could not reach /admin/day';
    return;
  }
  // The endpoint says which of the three it is -- wrong tier, unscheduled date,
  // malformed date -- and they want different reactions, so pass it through
  // rather than flattening it to "no game".
  if (!res.ok) {
    el('meta').textContent = `${body.error || res.status}`;
    return;
  }

  el('meta').textContent = when(date);
  // What a Reject costs, in front of the button rather than in the receipt after
  // it. With spares queued it costs one of them and the horizon does not move;
  // with none, the endpoint pays out of the schedule's tail and the date named
  // here is the day that goes. Same red as the other two things on this page a
  // reviewer must not misread.
  el('queue').textContent = body.queued
    ? `${body.queued} queued spare${body.queued === 1 ? '' : 's'}`
      + ` · scheduled through ${body.scheduled_through}`
    : `no queued spares — a reject gives up ${body.scheduled_through}`
      + ', the last scheduled day';
  el('queue').classList.toggle('warn', !body.queued);
  // Loud when it is live, because that is the state where a problem found here
  // is already in front of somebody and the Reject button is deliberately gone.
  el('meta').classList.toggle('live', body.open);
  el('rounds').innerHTML = body.rounds.map(r => render(r, date)).join('');
  drawMap(body.pool, body.rounds);
}

// Reject, and say what it cost. A rejection is paid for out of the schedule's
// tail whenever there is no queued surplus, so the confirmation names the round
// and the result names the day that was given up -- the alternative is a horizon
// that silently shrinks and a later "why does the schedule end on the 14th".
async function onReject(image) {
  const date = el('date').value;
  if (!confirm(`Reject ${image}?\n\nIt is replaced from the back of the queue, `
    + `which costs a day of runway when there is no surplus.`)) return;

  let res, out;
  try {
    res = await fetch('/admin/day', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ date, image }),
    });
    out = await res.json();
  } catch {
    el('meta').textContent = 'could not reach /admin/day';
    return;
  }
  if (!res.ok) {
    el('meta').textContent = out.error || `rejection failed (${res.status})`;
    return;
  }
  await show(date);
  el('meta').textContent = `replaced #${out.position} with ${out.replacement}`
    + (out.unscheduled_day ? ` — gave up ${out.unscheduled_day} to pay for it` : '')
    + ` · ${el('meta').textContent}`;
}

// Delegated, because the buttons are rewritten on every render and a listener
// per button would be a listener per render.
el('rounds').addEventListener('click', e => {
  const btn = e.target.closest('.reject');
  if (btn) onReject(btn.dataset.image);
});

el('date').addEventListener('change', e => show(e.target.value));
el('prev').addEventListener('click', () => show(shift(el('date').value, -1)));
el('next').addEventListener('click', () => show(shift(el('date').value, 1)));

// Today rather than tomorrow: it is the day most likely to be scheduled, so it
// answers "does this work" and "what is queued" in one load. → walks forward.
show(new URLSearchParams(location.search).get('date') || iso(new Date()));
</script>
</body>
</html>
