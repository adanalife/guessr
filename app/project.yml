# xcodegen spec: `xcodegen` in this directory writes Guessr.xcodeproj from it
# (gitignored), so targets are edited here, not in the Xcode GUI.
name: Guessr
options:
  bundleIdPrefix: lol.dana
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
# Swift 6 language mode for every target. xcodegen's fallback for a target that
# names no SWIFT_VERSION is Swift 5 mode, which turns data-race checking off.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    # A build writes every localizable literal it finds into the string
    # catalogs, so a new string shows up there needing translation.
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  GuessrKit:
    path: GuessrKit
  # Crash reports, hangs, request spans and logs — see Guessr/Telemetry.swift.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.29.0
  # Private: the owner's console controls. A build without access to it (a
  # fork, say) deletes this block and the matching dependency below, and the
  # console tier compiles out.
  # TempomatConsole:
  #   url: https://github.com/adanalife/tempomat
  #   branch: main
targets:
  Guessr:
    type: application
    supportedDestinations: [iOS]
    sources:
      - Guessr
    configFiles:
      Debug: Guessr.xcconfig
      Release: Guessr.xcconfig
    # Game Center: the sign-in and the dashboard. Scores and achievements reach
    # Apple from the server, not from GameKit -- see server/gamecenter.py.
    entitlements:
      path: Guessr/Guessr.entitlements
      properties:
        com.apple.developer.game-center: true
        # Universal links: the site's link-a-device QR code opens the app when
        # it is installed, by way of web/.well-known/apple-app-site-association.
        # Stage too, which is where a Debug build plays.
        com.apple.developer.associated-domains:
          - applinks:guessr.dana.lol
          - applinks:stage.guessr.dana.lol
    info:
      path: Guessr/Info.plist
      properties:
        CFBundleDisplayName: Guessr
        # App Store Connect refuses an upload without this top-level key; the
        # asset catalog compiler only writes it under CFBundlePrimaryIcon.
        CFBundleIconName: AppIcon
        # Read at launch; both default to empty in Guessr.xcconfig.
        GuessrTwitchClientID: $(GUESSR_TWITCH_CLIENT_ID)
        GuessrOwnerTwitchID: $(GUESSR_OWNER_TWITCH_ID)
        # Read by GuessrKit's Guessr.baseURL; set per configuration.
        GuessrAPIBase: $(GUESSR_API_BASE)
        # The channel the Chat tab talks in; set per configuration.
        GuessrTwitchChannel: $(GUESSR_TWITCH_CHANNEL)
        # A phone plays upright (clip over map) or on its side (clip beside
        # map), never upside down. An iPad window takes any shape, which iPad
        # multitasking requires.
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: GuessrKit
      # Sentry-Dynamic rather than the static `Sentry`: only the dynamic
      # xcframework ships dSYMs, so the SDK's own frames symbolicate
      # (getsentry/sentry-cocoa#4068).
      - package: Sentry
        product: Sentry-Dynamic
      # - package: TempomatConsole
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.dana.guessr
        # Both overridden per archive by `task ios:archive`: the version with the
        # repo's release tag, the build number with the commit count.
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        # The game's mark from web/favicon.svg on the dark ground of its
        # apple-touch-icon, one 1024 px image Xcode scales for every slot.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The web game's link color, light and dark, as every control's tint.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Export DEVELOPMENT_TEAM=<id> before `xcodegen`, or pick the team in
        # Xcode (lost on the next regen).
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      # The archive signs for distribution directly. Automatic signing asks
      # Apple for a development profile at archive time, which a team with no
      # registered devices cannot be issued; manual App Store signing needs no
      # device and no Xcode GUI. Debug keeps signing automatically.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Guessr App Store
schemes:
  Guessr:
    build:
      targets:
        Guessr: all
    run:
      config: Debug
