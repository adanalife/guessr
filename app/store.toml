# What the App Store listing says. `task asc:listing` reads App Store Connect
# back and plans the difference; `-- --apply` writes it. Contact details, the
# demo account and anything else that must not be public go in
# app/store.local.toml (gitignored), with the same tables; it is merged over
# this file.

# The release tag the store version is built from; the TestFlight build for
# that tag is what the version is attached to.
version = "1.25.0"

[app]
name = "Guessr"
# At most 30 characters.
subtitle = "Where was this dashcam?"
privacy_policy_url = "https://www.dana.lol/privacy/"
# App Store Connect's category ids.
primary_category = "GAMES"
primary_subcategory_one = "GAMES_TRIVIA"
primary_subcategory_two = "GAMES_PUZZLE"

[listing]
release_type = "MANUAL"
support_url = "https://www.dana.lol/contact/"
marketing_url = "https://guessr.dana.lol"
# At most 100 characters, comma-separated, no spaces after commas.
keywords = "dashcam,geography,guess,map,daily,puzzle,road trip,travel,geoguess,trivia"
promotional_text = ""
description = """
Five dashcam clips a day from one long road trip across the United States. Watch each clip, drop a pin on the map where you think it was filmed, and score up to 5,000 points for a guess on the spot.

The same five rounds for everyone, every day, so the leaderboard means something. Play against the regulars of the A Dana Life livestream, or just against yesterday's you.

• A new day of rounds every midnight UTC
• Points by distance, and the answer shown on the map after every guess
• Game Center leaderboards for lifetime and this week, with eight achievements
• A daily reminder and an icon badge while today's rounds are waiting
• Sign in with Twitch to read and join the stream's live chat
• Link your phone to the web game at guessr.dana.lol and keep one name and one score
• No account, no email, no ads. A random name is picked for you.
• In English, French, Spanish, Russian and Czech

Footage is the developer's own, recorded while living on the road.
"""
whats_new = """
First release on the App Store.
"""

[review]
contact_first_name = "Dana"
demo_account_required = true
notes = """
Guessr is a daily geography game over the developer's own dashcam footage. It needs no account: a random player name is made on first launch and kept in the Keychain.

TWITCH SIGN-IN (Settings > Twitch) is optional and exists only for the Chat tab, which is a client for one Twitch channel's live chat (reads and sends messages through Twitch's own API, under the user's own Twitch login). It does not create or authenticate an account with us, and nothing from Twitch reaches our servers, so we understand guideline 4.8's third-party-client exception to apply. The game is complete without signing in. A demo Twitch account is provided below; sign in at Settings > Sign in with Twitch, enter the code at twitch.tv/activate.

CHAT MODERATION: the chat is one channel, moderated by Twitch's AutoMod and the channel's moderators under Twitch's terms. Any user can long-press a line to hide that chatter on their device or report them on Twitch. Moderators of the channel additionally get delete, time out, warn and ban, through Twitch's moderation API; those appear only for an account Twitch lists as a moderator, and the demo account is a regular viewer. The channel is often quiet: send !location in the Chat tab and the channel's bot replies; long-press its line to hide or report it.

GAME CENTER: scores and achievements are submitted by our server (App Store Connect API), never by the app, after each recorded guess.

CONTENT: all video is the developer's own footage. The web game at guessr.dana.lol is the same game and the same daily rounds.
"""

# The age-rating declaration, attribute for attribute as App Store Connect
# names them (`task asc:listing` prints the current one). Content questions
# take NONE, INFREQUENT_OR_MILD or FREQUENT_OR_INTENSE; the rest are yes/no.
# The two trues are the Chat tab: a Twitch channel's live chat is user-generated
# content and messaging between users.
[age_rating]
advertising = false
alcoholTobaccoOrDrugUseOrReferences = "NONE"
contests = false
gambling = false
gamblingSimulated = "NONE"
gunsOrOtherWeapons = "NONE"
healthOrWellnessTopics = false
horrorOrFearThemes = "NONE"
lootBox = false
matureOrSuggestiveThemes = "NONE"
medicalOrTreatmentInformation = "NONE"
messagingAndChat = true
parentalControls = false
profanityOrCrudeHumor = "NONE"
sexualContentGraphicAndNudity = "NONE"
sexualContentOrNudity = "NONE"
socialMedia = false
unrestrictedWebAccess = false
userGeneratedContent = true
violenceCartoonOrFantasy = "NONE"
violenceRealistic = "NONE"
violenceRealisticProlongedGraphicOrSadistic = "NONE"
ageRatingOverrideV2 = "NONE"

[screenshots]
# Directory of PNGs per display type; `task ios:screenshots` fills it.
dir = "app/.build/screenshots"
# App Store Connect display type -> subdirectory.
APP_IPHONE_67 = "iphone"
APP_IPAD_PRO_3GEN_129 = "ipad"
