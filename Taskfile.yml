# Taskfile for the guessing game.
#
# The game is static files plus one endpoint. `rounds` does all the work up
# front — it needs the dashcam corpus mounted and kubectl access to the tripbot
# Postgres — and what it produces is a directory of HTML, JS and JPEGs (web/,
# deployed) and the answer coords (answers.json / answers.sql, never deployed
# and never committed; `answers:*:push` sends them to D1 instead).
#
# The same D1 also holds the tables the game itself owns — `plays`, which records
# a daily result once per player per round. Those are hand-written DDL in
# schema.sql, applied by `schema:*:push`.
#
# So there are two ways to run it locally: `serve` for anything that isn't
# scoring, and `dev` when a guess has to actually come back with points.

version: '3'

vars:
  PORT: '{{.PORT | default "8000"}}'
  # The round-set media. One bucket, not one per tier: a clip is the same bytes
  # whichever tier serves it, and the manifest each deploy carries is what
  # decides which of them that tier actually plays. The answers are the opposite
  # -- those are per-tier, because a regenerated set diverges the moment one tier
  # has it and the other doesn't.
  BUCKET: 'adanalife-guessr-clips'
  # The local D1 wrangler keeps under .wrangler/, seeded from answers.sql. Not
  # the deployed database — `answers:{stage,prod}:push` target those by name.
  LOCAL_DB: 'guessr-answers-local'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  rounds:
    desc: Build a round set (scores clips for locatability, cuts their clips)
    cmds:
      - python3 make_rounds.py {{.CLI_ARGS}}

  check:
    desc: Validate the generated round set
    cmds:
      - python3 check.py

  rounds:publish:
    desc: "Generate a round set and publish all three legs: media to R2, answers
      to both D1 tiers, manifest as a PR. Needs GITHUB_TOKEN + the Cloudflare
      pair. Args pass through to make_rounds.py"
    cmds:
      - ./publish.sh {{.CLI_ARGS}}

  # The media half of a round set. web/clips/ is gitignored -- a set is ~150 MB
  # and this repo is public -- so the bucket is how a deploy gets it: the three
  # deploy workflows run the pull side of this before handing web/ to
  # `wrangler pages deploy`. See clips.sh for why the object is named after a
  # hash of the manifest rather than something stable.
  #
  # check.py first, and not as a convenience: the HUD-crop assertion is the only
  # thing standing between a clip with the coordinates burned into it and the
  # served game, and now that the media never reaches CI this is the last place
  # it runs before the bytes leave the laptop.
  clips:push:
    desc: Upload web/clips/ to R2, which is where the deploy workflows read it from
    deps: [check]
    cmds:
      - ./clips.sh push

  clips:pull:
    desc: Fetch the clips for the committed manifest (what the deploy workflows run)
    cmds:
      - ./clips.sh pull

  serve:
    desc: Serve the static game on $PORT (binds all interfaces, so a phone on
      the tailnet can reach it). Guessing does not score — use `dev` for that
    cmds:
      - python3 -m http.server -d web {{.PORT}}

  dev:
    desc: Run the game with scoring, against a local D1 seeded from answers.sql
    deps: [schema:local:push, answers:local:push]
    cmds:
      - npx wrangler pages dev web/ --port {{.PORT}} --d1 ANSWERS={{.LOCAL_DB}}

  answers:local:push:
    desc: Seed answers.sql into the local D1 that `dev` binds
    cmds:
      - npx wrangler d1 execute {{.LOCAL_DB}} --local --config wrangler.local.jsonc --file answers.sql --yes

  # The tables the game owns, as opposed to the rows a round set fills in.
  # Separate from answers:*:push because the two change on completely different
  # clocks: answers.sql is regenerated and re-pushed with every round set, while
  # schema.sql is idempotent DDL that a database needs once. Re-running either is
  # harmless.
  schema:local:push:
    desc: Apply schema.sql to the local D1 that `dev` binds
    cmds:
      - npx wrangler d1 execute {{.LOCAL_DB}} --local --config wrangler.local.jsonc --file schema.sql --yes

  schema:stage:push:
    desc: Apply schema.sql to the staging D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers-staging, FILE: schema.sql}

  schema:prod:push:
    desc: Apply schema.sql to the production D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers, FILE: schema.sql}

  # The coords, into the deployed databases. Separate targets per environment
  # rather than one with a flag, so nothing reaches production by defaulting
  # there.
  #
  # Both need Cloudflare auth, which a fresh shell has not got — `wrangler
  # whoami` says so, and without it these fail on an auth error that doesn't
  # mention how to fix it. Cheapest fix is `npx wrangler login` once (OAuth,
  # remembered and refreshed); the terraform token in SSM works too if a
  # non-interactive shell ever needs it, since it carries D1:Edit.
  answers:stage:push:
    desc: Seed answers.sql into the staging D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers-staging, FILE: answers.sql}

  answers:prod:push:
    desc: Seed answers.sql into the production D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers, FILE: answers.sql}

  _d1:push:
    internal: true
    cmds:
      - npx wrangler d1 execute {{.DB}} --remote --file {{.FILE}} --yes

  # How the game is being played, read back out of the plays it already records.
  # See stats.sql for the questions.
  stats:stage:
    desc: Play stats from the staging D1
    cmds:
      - task: _d1:stats
        vars: {DB: adanalife-guessr-answers-staging}

  stats:prod:
    desc: Play stats from the production D1 (read-only)
    cmds:
      - task: _d1:stats
        vars: {DB: adanalife-guessr-answers}

  # --command rather than --file: --file is D1's *import* path, which reports
  # only a row count and marks the database changed. And --command= with the
  # equals sign, or wrangler reads the leading `--` of a SQL comment as a flag.
  _d1:stats:
    internal: true
    cmds:
      - npx wrangler d1 execute {{.DB}} --remote --json --command="$(cat stats.sql)" | jq '[.[].results]'

  # Changelog (towncrier). Fragments live in changelog.d/, one per PR, and are
  # collated into CHANGELOG.md at release time. Run via uvx — no project dep.
  # The About panel links to that file, so the entries are written for players;
  # towncrier.toml says what that means.
  changelog:add:
    desc: 'Scaffold a changelog fragment (TYPE=new, optional SLUG=my-thing; CI numbers it on push). Pass PR=123 to name it directly. Types: new changed fixed behind summary'
    vars:
      TYPE: '{{.TYPE | default "new"}}'
      # No PR yet? Drop a "+" placeholder (towncrier's issue-less convention) —
      # changelog-number.yml renames it to <PR#>.<type>.md once the PR is open.
      NAME: '{{if .PR}}{{.PR}}{{else}}+{{.SLUG | default .TYPE}}{{end}}'
    cmds:
      - uvx towncrier create --config towncrier.toml {{.NAME}}.{{.TYPE}}.md

  changelog:preview:
    desc: Preview the pending changelog from the current fragments (towncrier draft)
    cmds:
      - uvx towncrier build --draft --config towncrier.toml --version {{.VERSION | default "Unreleased"}}

  changelog:build:
    desc: Collate fragments into CHANGELOG.md for a release + delete them (VERSION=0.9.0). CI does this on the release PR — this is for checking the result by hand
    requires:
      vars: [VERSION]
    cmds:
      - uvx towncrier build --yes --config towncrier.toml --version {{trimPrefix "v" .VERSION}}

  test:
    desc: Run the tests that need no corpus and no database to be running (daily
      draw, leaderboard aliases and ranking, frame zoom, scoring, the device
      merge, frame dimensions, round-set swap, seeding, selection, db route)
    # Globbed rather than listed, because a list of test files is a list that
    # drifts: test_select.py sat here unrun by anything from the day it was
    # added. Adding a test_*.py or test_*.mjs is now the whole job of wiring it
    # up. `|| exit 1` because a shell for-loop exits with its *last* command's
    # status, so without it a failure in the middle passes.
    cmds:
      - for f in test_*.mjs test_*.js; do echo "== $f"; node "$f" || exit 1; done
      - for f in test_*.py; do echo "== $f"; python3 "$f" || exit 1; done

  smoke:
    desc: "Check a deployed tier is actually playable: task smoke -- <base-url>.
      Read-only, so it is safe against production — and the thing to run by hand
      after an answers push"
    cmds:
      - ./smoke.sh {{.CLI_ARGS}}

  build:
    desc: Generate a fresh round set and validate it
    cmds:
      - task: rounds
      - task: check
