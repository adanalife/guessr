# Taskfile for the guessing game.
#
# The game is static files plus a few endpoints. `rounds` does all the work up
# front — it needs the dashcam corpus mounted and kubectl access to the tripbot
# Postgres — and what it produces is mp4 clips (web/clips/, pushed to R2), the
# pool and the schedule (rounds.sql) and the answer coords (answers.sql). None of
# the three is deployed or committed: `clips:push` sends the media to the bucket
# and `rounds:*:push` / `answers:*:push` send the rows to D1.
#
# Which is the point. A round set is data, so changing one is three pushes rather
# than a pull request and a deploy.
#
# The same D1 holds the tables all of it lives in — `rounds`, `round_days`,
# `answers`, and `plays`, which records a daily result once per player per round.
# Those are numbered migrations under migrations/, applied by `schema:*:apply`,
# and a fresh database needs them before any of the seeds will land.
#
# So there are two ways to run it locally: `serve` for anything that isn't
# scoring, and `dev` when a guess has to actually come back with points.

version: '3'

vars:
  PORT: '{{.PORT | default "8000"}}'
  # The round-set media. One bucket, not one per tier: a clip is the same bytes
  # whichever tier serves it, and each tier's own schedule is what decides which
  # of them it actually plays. The rows are the opposite -- those are per-tier,
  # because a regenerated set diverges the moment one tier has it and the other
  # doesn't.
  BUCKET: 'adanalife-guessr-clips'

  # Where xcodebuild keeps the resolved packages (clones and binary artifacts):
  # one copy per machine rather than one per worktree. Build products stay
  # per-worktree under .build/DerivedData; only the packages are shared. The
  # largest is sentry-cocoa's 2.9 GB xcframework, so a per-worktree copy fills
  # a disk, and a worktree that has never built finds the packages already
  # present, so its first build needs no network (the tool sandbox has none).
  SPM_CLONES: '$HOME/Library/Caches/adanalife/SourcePackages/guessr'
  # The sqlite file `dev` serves from, migrated then seeded from the two
  # generated files. Gitignored, and rebuilt on every run.
  LOCAL_DB: 'answers.db'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # Runs check.py itself before swapping the new set into web/, and refuses to
  # swap if it fails -- so there is nothing to chain a validation onto afterwards.
  rounds:
    desc: Build a round set (scores clips for locatability, cuts their clips)
    cmds:
      - python3 make_rounds.py {{.CLI_ARGS}}

  check:
    desc: Validate the generated round set
    cmds:
      - python3 check.py

  rounds:publish:
    desc: "Generate a round set and publish all three legs to STAGING: media to
      R2, answers to D1, pool and schedule to D1. No deploy, no PR. Needs the
      Cloudflare pair. Args pass through to make_rounds.py"
    cmds:
      - ./publish.sh {{.CLI_ARGS}}

  # The media half of a round set. web/clips/ is gitignored -- a set is ~150 MB
  # and this repo is public -- so the bucket is where the served game reads it
  # from: the Pages /clips/ route streams each clip out of R2 at request
  # time. No deploy is involved, which is what lets a round set change without
  # one. See clips.sh for why it is one object per clip rather than a tarball.
  #
  # check.py first, and not as a convenience: the HUD-crop assertion is the only
  # thing standing between a clip with the coordinates burned into it and the
  # served game, and the media never reaches CI -- so this is the last place it
  # runs before the bytes leave the laptop.
  clips:push:
    desc: Upload web/clips/ to R2, which is where the served game reads them from
    deps: [check]
    cmds:
      - ./clips.sh push

  # The stills behind "here's where you guessed": one per ~2 km cell the corpus
  # drove through. Separate from a round set because nothing about them changes
  # when the rounds do -- they only move when the corpus does, so this runs once
  # and again after a footage ingest, not weekly. Resumable: a still already in
  # web/reveals/ is not cut again. Same needs as `rounds`.
  reveals:
    desc: Cut the "where you guessed" stills into web/reveals/ and write reveals.sql
      (needs the corpus + the tripbot DB; LIMIT=N to try a few)
    cmds:
      - python3 reveals.py {{if .LIMIT}}--limit {{.LIMIT}}{{end}} {{.CLI_ARGS}}

  # Media before rows, always: a row naming a still that is not in the bucket is
  # a broken image in a popup, and a still nothing names is invisible.
  reveals:push:
    desc: Upload web/reveals/ to R2 (before reveals:*:rows)
    cmds:
      - PREFIX=reveals CONTENT_TYPE=image/jpeg ./clips.sh push web/reveals/*.jpg

  reveals:stage:rows:
    desc: Seed reveals.sql into the staging D1 (after reveals:push)
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers-staging, FILE: reveals.sql}

  reveals:prod:rows:
    desc: Seed reveals.sql into the production D1 (after reveals:push and schema:prod:apply)
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers, FILE: reveals.sql}

  # Not part of any deploy -- the endpoint reads the bucket directly. This is for
  # a machine with no corpus that wants a local copy of the scheduled set, and for
  # checking by hand that a push landed. It asks the staging D1 what is scheduled,
  # because the schedule is the only list of clips there is.
  clips:pull:
    desc: Download the scheduled set's clips into web/clips/ (no corpus needed)
    cmds:
      - ./clips.sh pull

  serve:
    desc: Serve the static game on $PORT (binds all interfaces, so a phone on
      the tailnet can reach it). Guessing does not score — use `dev` for that
    cmds:
      - python3 -m http.server -d web {{.PORT}}

  dev:
    desc: Run the game with scoring, under uvicorn against a sqlite file seeded from answers.sql and rounds.sql
    # A fresh database every run: the migrations replay from scratch and the
    # seed SQL upserts, so the cheapest way to pick up a regenerated set is to
    # rebuild from the two files rather than reconcile. Answers before rounds --
    # the schedule's foreign keys point at the answers.
    #
    # The clips come from web/clips/, which `task rounds` writes and `clips:pull`
    # fetches. Nobody is admitted to /admin/ unless TWITCH_OWNER_ID,
    # TWITCH_CHANNEL_ID and TWITCH_CLIENT_IDS are in the environment
    # (server/local.py's docstring).
    cmds:
      - rm -f {{.LOCAL_DB}}
      - uv run --project api python -c "from server.db import Sqlite; db = Sqlite('{{.LOCAL_DB}}').migrate(); [db.conn.executescript(open(f).read()) for f in ('answers.sql', 'rounds.sql')]"
      # A tier for the page to read: it gates the Place-random and Reset buttons,
      # which a local game wants. Gitignored, like every other copy of this
      # file, and it fills the About panel's empty version line as a side effect.
      - printf '{"label":"local","tier":"local"}\n' > web/version.json
      - GUESSR_DB={{.LOCAL_DB}} GUESSR_CLIPS=web/clips PORT={{.PORT}} uv run --project api python -m server.local

  # What the Python Worker ships, staged apart from the repo (the script says
  # why). staging.yml runs the same script before its deploy.
  api:bundle:
    desc: Stage server/ and the alias wordlist into api/bundle/ for the Python Worker
    cmds:
      - ./scripts/api-bundle.sh

  # The whole site off Cloudflare, one process: server/local.py's docstring
  # names the env it reads (sqlite file, clip directory, admin ids, host/port).
  api:serve:
    desc: Serve guessr under uvicorn from a sqlite file and a clip directory (no Workers runtime)
    cmds:
      - uv run --project api python -m server.local

  # The Python Worker under workerd, against a local D1 and R2 keyed like the
  # staging ones (`npx wrangler d1 migrations apply adanalife-guessr-answers-staging
  # --local` from api/ gives it tables). pywrangler vendors starlette and the
  # Workers SDK into api/python_modules/ first. An edit to server/ needs a
  # restart, since what runs is the staged copy.
  api:dev:
    desc: Run the Python Worker locally under pywrangler (args pass through to wrangler dev)
    deps: [api:bundle]
    dir: api
    cmds:
      - uv run pywrangler dev {{.CLI_ARGS}}

  # The tables, as opposed to the rows a round set fills in. Numbered migrations
  # under migrations/, applied in order and recorded in each database's own
  # `d1_migrations` ledger — so "which tier is at which version" is a question
  # with an answer (`schema:*:status`) rather than something to infer from
  # whether a query 500s. See README, "The schema".
  #
  # Separate from the seed pushes because the two change on completely different
  # clocks: a round set rewrites rounds.sql and answers.sql every time, while the
  # shape moves rarely and only forwards.
  #
  # `apply` auto-confirms its prompt when stdout is not a terminal, so these are
  # safe from a script; run by hand you get the confirmation.
  # An apply is not atomic across migrations: each one is recorded in the
  # `d1_migrations` ledger as it lands, so a remote apply that dies partway (D1's
  # `storage operation exceeded timeout ... [code: 7429]`, which has followed a
  # `backup:prod` export by seconds) leaves the earlier ones applied and the rest
  # not. Recovery is re-running the apply, which resumes from the ledger -- never
  # `--force` it or hand-run the SQL. The deferred status runs whether the apply
  # succeeded or not, so a half-applied tier is on screen either way.
  schema:stage:apply:
    desc: Apply pending migrations to the staging D1
    cmds:
      - defer: {task: schema:stage:status}
      - task: _d1:migrate
        vars: {DB: adanalife-guessr-answers-staging, VERB: apply}

  schema:prod:apply:
    desc: Apply pending migrations to the production D1
    cmds:
      - defer: {task: schema:prod:status}
      - task: _d1:migrate
        vars: {DB: adanalife-guessr-answers, VERB: apply}

  # How far behind a tier is, which is the question the `d1_migrations` ledger
  # exists to answer. Read-only, so it is safe against production and is the
  # thing to run before assuming a deploy is broken.
  schema:stage:status:
    desc: List migrations the staging D1 has not applied
    cmds:
      - task: _d1:migrate
        vars: {DB: adanalife-guessr-answers-staging, VERB: list}

  schema:prod:status:
    desc: List migrations the production D1 has not applied
    cmds:
      - task: _d1:migrate
        vars: {DB: adanalife-guessr-answers, VERB: list}

  # What to run before a migration, and before anything else that writes
  # production. `d1 export` walks the database over the API and writes plain SQL,
  # so the artifact is readable, diffable, and restorable into any SQLite.
  #
  # That is deliberately not the fastest way back. D1 keeps 30 days of
  # point-in-time restore (`wrangler d1 time-travel restore <db> --timestamp=...`),
  # which needs no artifact and is the thing to reach for when a migration went
  # wrong minutes ago. This is the copy that can be read *before* deciding, that
  # can be diffed against what is live, and that outlives the account holding it.
  #
  # Production only. Staging is rebuildable from a generation run, so a dump of it
  # would be a file nobody would ever restore.
  #
  # It is not free to run: wrangler warns that the database cannot serve queries
  # while an export is in flight, so this is a few seconds during which a guess
  # could 500. At this size that measured ~3 s for 781 rows, which is fine before
  # a migration and is not something to put on a schedule.
  #
  # Verified rather than assumed: an export that failed halfway still leaves a
  # file, and a backup nobody looked at is the one that turns out to be empty on
  # the day it matters. Checking that `plays` is declared is enough to separate a
  # real dump from a truncated one -- it is the one table whose contents cannot be
  # regenerated from anything.
  backup:prod:
    desc: Dump the production D1 to backups/ — run this before any migration or push
    cmds:
      - mkdir -p backups
      - |
        out="backups/adanalife-guessr-answers-$(date -u +%Y%m%dT%H%M%SZ).sql"
        npx wrangler d1 export adanalife-guessr-answers --remote --output "$out"
        if ! grep -q 'CREATE TABLE.*plays' "$out"; then
          echo "the export wrote $out but it does not declare plays, so it is not a backup" >&2
          exit 1
        fi
        echo "backed up to $out ($(wc -c < "$out" | tr -d ' ') bytes)"

  # --config, unlike _d1:push. `d1 execute` resolves a bare database name against
  # the API; `d1 migrations` refuses to run without a config file and refuses
  # again without a database_id in it. See wrangler.d1.jsonc.
  _d1:migrate:
    internal: true
    cmds:
      - npx wrangler d1 migrations {{.VERB}} {{.DB}} --remote --config wrangler.d1.jsonc

  # The coords, into the deployed databases. Separate targets per environment
  # rather than one with a flag, so nothing reaches production by defaulting
  # there.
  #
  # Both need Cloudflare auth, which a fresh shell has not got — `wrangler
  # whoami` says so, and without it these fail on an auth error that doesn't
  # mention how to fix it. Cheapest fix is `npx wrangler login` once (OAuth,
  # remembered and refreshed); the terraform token in SSM works too if a
  # non-interactive shell ever needs it, since it carries D1:Edit.
  answers:stage:push:
    desc: Seed answers.sql into the staging D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers-staging, FILE: answers.sql}

  answers:prod:push:
    desc: Seed answers.sql into the production D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers, FILE: answers.sql}

  # The pool and the schedule -- the leg that actually makes a date playable.
  # Separate from answers:*:push and pushed after it, because the two fail in
  # opposite directions: answers ahead of a schedule is invisible, a schedule
  # ahead of its answers is `unknown round` on every guess of a live game.
  #
  # STAGING ONLY from a full generation run. There is deliberately no
  # rounds:prod:push: production is reached only through the top-up below, whose
  # contract (never inside the review window, never a clip the tier holds, only
  # what is missing) is exactly what a bare push of a fresh rounds.sql would not
  # honour.
  rounds:stage:push:
    desc: Seed rounds.sql (the pool and the schedule) into the staging D1
    cmds:
      - task: _d1:push
        vars: {DB: adanalife-guessr-answers-staging, FILE: rounds.sql}
      # The push cannot tell that a round it sent was dropped as already
      # scheduled, so the day it should have filled is short and nothing says so.
      # publish.sh runs this too; it is here because a bare push is the path that
      # bypasses publish.sh entirely.
      - ./verify_days.sh adanalife-guessr-answers-staging staging

  # Read-only, and the same question verify_days.sh asks -- for looking between
  # pushes, since a reject can empty a slot with no push involved.
  days:stage:
    desc: Check every upcoming staging date holds a full game
    cmds:
      - ./verify_days.sh adanalife-guessr-answers-staging staging

  days:prod:
    desc: Check every upcoming production date holds a full game
    cmds:
      - ./verify_days.sh adanalife-guessr-answers production

  # How staging stays playable: copy production's upcoming schedule over, which
  # the shared clips bucket makes a row copy rather than a generation. No-op
  # when staging is not short, so it leaves a set under review alone. The same
  # invocation the daily stage-schedule workflow runs.
  rounds:stage:mirror:
    desc: Mirror production's upcoming schedule onto staging (no-op when playable,
      DRY_RUN=1 to print the script)
    cmds:
      - python3 mirror_stage.py {{if .DRY_RUN}}--dry-run{{end}}

  # How production stays scheduled: generate only what is missing to keep it
  # TOPUP_DAYS ahead, never inside TOPUP_LEAD days of an open date (that lead is
  # the reject window), never a clip production already holds. Exits without
  # generating when the horizon is healthy. The same invocation the CronJob runs;
  # publish.sh holds the whole contract.
  rounds:topup:
    desc: Top production's schedule up per the top-up contract (no-op when healthy)
    cmds:
      - ./publish.sh --top-up {{.CLI_ARGS}}

  # Restore one round's media: re-cut it from the corpus and put it back at the
  # same key. For a clip that was deleted, corrupted, or never uploaded.
  #
  # One task rather than a :stage/:prod pair, because there is only one bucket
  # (see BUCKET above) and so only one place the bytes can go. DB selects which
  # tier's round pool is read for provenance, and that read is a SELECT.
  rounds:rebuild:
    desc: "Re-cut and re-upload one round's clip (IMAGE=clips/<slug>-<ms>.mp4,
      optional DB=, DRY_RUN=1). Needs the corpus"
    cmds:
      - python3 rebuild.py {{.IMAGE}}
        {{if .DB}}--db {{.DB}}{{end}}
        {{if .DRY_RUN}}--dry-run{{end}}
        {{if .FORCE}}--force{{end}}
    requires:
      vars: [IMAGE]

  _d1:push:
    internal: true
    cmds:
      - npx wrangler d1 execute {{.DB}} --remote --file {{.FILE}} --yes

  # How the game is being played, read back out of the plays it already records.
  # See stats.sql for the questions.
  stats:stage:
    desc: Play stats from the staging D1
    cmds:
      - task: _d1:ask
        vars: {DB: adanalife-guessr-answers-staging, FILE: stats.sql}

  stats:prod:
    desc: Play stats from the production D1 (read-only)
    cmds:
      - task: _d1:ask
        vars: {DB: adanalife-guessr-answers, FILE: stats.sql}

  # Putting a name to a player id, so a board and the stats say who someone is
  # rather than which wordlist pair they drew. The ids come out of `stats:*` --
  # the best-days query prints one beside every score.
  #
  # NAME is published: it replaces that player's own name everywhere one renders,
  # including the stream overlay. NOTE is not, and no endpoint reads it -- it is
  # for recognising a player without announcing what you recognised them by. So
  # NOTE alone is the private option, and both together is "call them this, and
  # here is why".
  #
  # Either one empty clears it, which is how a published name is taken back down.
  player:stage:
    desc: Name a player in staging (ID=<player_id> NAME='Phil' NOTE='met at the meetup')
    cmds:
      - task: _d1:name
        vars: {DB: adanalife-guessr-answers-staging}

  player:prod:
    desc: Name a player in production (ID=<player_id> NAME='Phil' NOTE='...')
    cmds:
      - task: _d1:name
        vars: {DB: adanalife-guessr-answers}

  # The one write in this file that takes free text from the command line, so it
  # is the one that has to quote, twice over.
  #
  # The arguments reach the shell as environment variables rather than as
  # template substitutions, because a substitution is spliced in before the shell
  # parses the line: NAME="Phil's" would close the quote it was pasted inside and
  # the rest would be read as code. Through the environment the value is never
  # parsed at all.
  #
  # `q` is the second half, and quotes for SQLite rather than for the shell --
  # doubling any apostrophe and wrapping the result, which is SQLite's own
  # escaping. "Phil's roommate" is an ordinary thing to put in a NOTE and would
  # otherwise end the string literal mid-sentence.
  #
  # NULLIF turns an empty argument into a NULL rather than an empty string, so
  # `NAME=` clears the alias instead of publishing a blank one, and omitting an
  # argument entirely clears the column it names.
  _d1:name:
    internal: true
    requires:
      vars: [ID]
    env:
      PLAYER_ID: '{{.ID}}'
      PLAYER_NAME: '{{.NAME}}'
      PLAYER_NOTE: '{{.NOTE}}'
    cmds:
      - |
        q() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"; }
        npx wrangler d1 execute {{.DB}} --remote --command="
          INSERT INTO players (player_id, alias, note)
          VALUES ($(q "$PLAYER_ID"), NULLIF($(q "$PLAYER_NAME"), ''), NULLIF($(q "$PLAYER_NOTE"), ''))
          ON CONFLICT (player_id) DO UPDATE SET
            alias = excluded.alias,
            note = excluded.note,
            updated_at = datetime('now')"

  # How far ahead each tier is scheduled, and what there is to schedule with.
  # See schedule.sql for the questions.
  schedule:stage:
    desc: Schedule horizon and queue depth from the staging D1
    cmds:
      - task: _d1:ask
        vars: {DB: adanalife-guessr-answers-staging, FILE: schedule.sql}

  schedule:prod:
    desc: Schedule horizon and queue depth from the production D1 (read-only)
    cmds:
      - task: _d1:ask
        vars: {DB: adanalife-guessr-answers, FILE: schedule.sql}

  # Run a checked-in query file and print its result sets. --command rather
  # than --file: --file is D1's *import* path, which reports only a row count
  # and marks the database changed. And --command= with the equals sign, or
  # wrangler reads the leading `--` of a SQL comment as a flag.
  _d1:ask:
    internal: true
    cmds:
      - npx wrangler d1 execute {{.DB}} --remote --json --command="$(cat {{.FILE}})" | jq '[.[].results]'

  # Changelog (towncrier). Fragments live in changelog.d/, one per PR, and are
  # collated into CHANGELOG.md at release time. Run via uvx — no project dep.
  # The About panel links to that file, so the entries are written for players;
  # towncrier.toml says what that means.
  changelog:add:
    desc: 'Scaffold a changelog fragment (TYPE=new, optional SLUG=my-thing; the release numbers it). Types: new changed fixed behind summary'
    vars:
      TYPE: '{{.TYPE | default "new"}}'
      # The branch is the fallback slug because it is unique per PR. Defaulting
      # to the type instead gives every no-SLUG entry the same +<type>.<type>.md.
      BRANCH:
        sh: git rev-parse --abbrev-ref HEAD | tr -c '[:alnum:]' '-' | sed 's/-\{1,\}/-/g; s/^-//; s/-$//'
      # Placeholders wait on main until a release numbers them, so a slug has to
      # stay unique across every open PR and every unreleased one — a reused
      # SLUG or branch name would otherwise land on the same file. Four hex
      # digits make that a 1-in-65536 accident rather than a habit.
      SUFFIX:
        sh: openssl rand -hex 2
      NAME: '+{{.SLUG | default .BRANCH}}-{{.SUFFIX}}'
    cmds:
      - uvx towncrier create --config towncrier.toml {{.NAME}}.{{.TYPE}}.md

  changelog:preview:
    desc: Preview the pending changelog from the current fragments (towncrier draft)
    cmds:
      - uvx towncrier build --draft --config towncrier.toml --version {{.VERSION | default "Unreleased"}}

  changelog:build:
    desc: Collate fragments into CHANGELOG.md for a release + delete them (VERSION=0.9.0). CI does this on the release PR — this is for checking the result by hand
    requires:
      vars: [VERSION]
    cmds:
      - scripts/number-fragments.sh
      - uvx towncrier build --yes --config towncrier.toml --version {{trimPrefix "v" .VERSION}}

  # Vendored third-party frontend assets (Leaflet, the et-book fonts). vendor.txt
  # is the pin list; bump a version there and re-sync rather than editing a file
  # under web/leaflet/ or web/et-book/ by hand.
  vendor:sync:
    desc: Re-download the vendored frontend assets at the versions pinned in vendor.txt
    cmds:
      - ./scripts/vendor.sh sync

  vendor:check:
    desc: Assert each vendored asset is still byte-identical to its pinned upstream release
    cmds:
      - ./scripts/vendor.sh check

  vendor:latest:
    desc: Report vendored assets with a newer release upstream
    cmds:
      - ./scripts/vendor.sh latest

  check:names:
    desc: Assert every backticked `task <name>` and repo-relative path in the docs resolves
    cmds:
      - ./scripts/check-doc-names.py

  test:
    desc: Run the tests that need no corpus and no database to be running (daily
      draw, leaderboard aliases and ranking, frame zoom, scoring, request
      deadlines, the device merge, frame dimensions, round-set swap, seeding,
      selection, db route)
    # Globbed rather than listed, because a list of test files is a list that
    # drifts: a test file nobody remembers to add to it is a test that never
    # runs, and it fails by staying green. Adding a test_*.py or test_*.mjs is
    # the whole job of wiring it up. `|| exit 1` because a shell for-loop exits
    # with its *last* command's status, so without it a failure in the middle
    # passes.
    cmds:
      - for f in test_*.mjs; do echo "== $f"; node "$f" || exit 1; done
      # uv, for the one dependency the server tests need: Starlette.
      - for f in test_*.py; do echo "== $f"; uv run --project api python "$f" || exit 1; done

  # The tier between `test` and `smoke`: the whole app under uvicorn over a
  # throwaway sqlite file and clip directory, with Twitch stubbed at the fetch
  # seam, held to every route's HTTP contract in contract.py. `test` proves
  # handler logic; `smoke` proves a deployed tier; this proves the two ends meet
  # -- migrations apply, routes resolve, every answer has the promised shape.
  # Touches nothing in the repo; its world is a temp dir.
  test:integration:
    desc: Assert every route's HTTP contract against the app under uvicorn (no corpus needed)
    cmds:
      - uv run --project api python integration_uvicorn.py

  smoke:
    desc: "Check a deployed tier is actually playable: task smoke -- <base-url>.
      Read-only, so it is safe against production — and the thing to run by hand
      after an answers push"
    cmds:
      - ./smoke.sh {{.CLI_ARGS}}

  # The iOS app (app/). The version is the repo's release tag: one version for
  # the web game and the app, so a TestFlight build and a GitHub release mean
  # the same thing. Signing reads DEVELOPMENT_TEAM and the App Store Connect
  # API key (ASC_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID) from the environment.
  ios:gen:
    desc: Write app/Guessr.xcodeproj from app/project.yml (export DEVELOPMENT_TEAM=<id> for signing)
    dir: app
    cmds:
      - xcodegen generate --spec project.yml
      # The generated project is gitignored, so its resolved package versions
      # can't be committed in place. The checked-in app/Package.resolved is the
      # source of truth; seeding it here keeps every checkout on the same
      # revisions. To move a pin, edit project.yml, build, then copy it back:
      #   cp Guessr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved Package.resolved
      - mkdir -p Guessr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
      - cp Package.resolved Guessr.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

  # SIM is the newest available iPhone simulator unless overridden
  # (SIM='iPhone 17 Pro'). None listed means the iOS platform isn't
  # downloaded: `xcodebuild -downloadPlatform iOS`.
  ios:build:
    desc: Build the app for the simulator (needs Xcode)
    dir: app
    deps: [ios:gen]
    vars:
      SIM:
        sh: xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name|startswith("iPhone")) | .name] | last // empty'
      # Build settings for xcodebuild's command line, e.g. from ios:screenshots.
      SETTINGS: '{{.SETTINGS | default ""}}'
    preconditions:
      - sh: test -n "{{.SIM}}"
        msg: "No iPhone simulator available — run: xcodebuild -downloadPlatform iOS"
    cmds:
      - xcodebuild -scheme Guessr -destination 'platform=iOS Simulator,name={{.SIM}}' -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath {{.SPM_CLONES}} -quiet build {{.SETTINGS}}

  # Signs for distribution (the Release config in app/project.yml), so it needs
  # the "Apple Distribution" certificate in the login keychain.
  ios:icon:
    desc: Re-render the app icon's light/dark/tinted variants from web/favicon.svg
    cmds:
      - ./scripts/make-app-icon.sh

  ios:archive:
    desc: Archive a signed iPhone build (needs DEVELOPMENT_TEAM)
    dir: app
    deps: [ios:gen]
    vars:
      # The newest release tag. Off a tag this is the last release, so only
      # ios:release promises the build is that version.
      TAG:
        sh: git describe --tags --abbrev=0 --match 'v*'
      # Monotonic and unique per commit, which is all App Store Connect asks
      # of a build number — it refuses a version+build pair it has seen.
      BUILD:
        sh: git rev-list --count HEAD
    preconditions:
      - sh: test -n "$DEVELOPMENT_TEAM"
        msg: "Set DEVELOPMENT_TEAM=<team id> first — see app/README.md's TestFlight section"
    cmds:
      - rm -rf .build/Guessr.xcarchive
      # The API key is what lets a machine that has never opened the portal
      # download the distribution profile the project names.
      - |
        xcodebuild -scheme Guessr -destination 'generic/platform=iOS' \
          -archivePath .build/Guessr.xcarchive -clonedSourcePackagesDirPath {{.SPM_CLONES}} -allowProvisioningUpdates \
          ${ASC_KEY_PATH:+-authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"} \
          MARKETING_VERSION={{trimPrefix "v" .TAG}} CURRENT_PROJECT_VERSION={{.BUILD}} -quiet archive
      - 'echo "archived {{trimPrefix "v" .TAG}} ({{.BUILD}}) to app/.build/Guessr.xcarchive"'

  # Uploads whatever ios:archive last produced rather than archiving itself: an
  # upload can fail for reasons the build has no part in (no App Store Connect
  # app record, an expired session, the network), and a retry should cost
  # seconds, not a fresh signed archive.
  ios:upload:
    desc: Upload the last iPhone archive to App Store Connect for TestFlight
    cmds:
      - task: ios:export
        vars: { DESTINATION: upload }
      - 'echo "uploaded — the build appears in TestFlight once Apple finishes processing (usually 5-15 min)"'

  # The same export with the IPA kept on disk instead of sent: it signs and
  # checks the archive the way App Store Connect would (a missing icon, a
  # missing CFBundleIconName), so a refusal costs a minute here rather than an
  # upload round trip. Leaves the IPA in app/.build/export.
  ios:validate:
    desc: Run the App Store export checks on the last iPhone archive without uploading
    cmds:
      - task: ios:export
        vars: { DESTINATION: export }

  ios:export:
    internal: true
    dir: app
    requires:
      vars: [DESTINATION]
    preconditions:
      - sh: test -d .build/Guessr.xcarchive
        msg: "No archive at app/.build/Guessr.xcarchive — run: task ios:archive"
      # Read off the archive, not the xcconfig: an empty client id builds fine
      # and ships an app with the Twitch login and the Chat tab hidden, which is
      # right for a fork and never for an upload to this app's TestFlight.
      - sh: test -n "$(plutil -extract GuessrTwitchClientID raw .build/Guessr.xcarchive/Products/Applications/Guessr.app/Info.plist 2>/dev/null)"
        msg: "The archive has no GUESSR_TWITCH_CLIENT_ID, so its Twitch login is off — set it in app/Local.xcconfig (see app/README.md) and re-archive"
    cmds:
      # Written per run rather than committed, so the team id stays out of the
      # repo and the plist can never drift from DEVELOPMENT_TEAM.
      - |
        cat > .build/ExportOptions.plist <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>{{.DESTINATION}}</string>
          <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
          <key>signingStyle</key><string>automatic</string>
          <key>uploadSymbols</key><true/>
          <key>manageAppVersionAndBuildNumber</key><false/>
        </dict>
        </plist>
        PLIST
      # /usr/bin first so the IPA step's rsync is the system one: Xcode runs
      # `rsync -8aPhhE`, where -E means --extended-attributes only to Apple's
      # rsync, and a Homebrew rsync earlier on PATH rejects it — the export
      # then dies on a bare "Copy failed".
      - |
        PATH=/usr/bin:$PATH xcodebuild -exportArchive \
          -archivePath .build/Guessr.xcarchive \
          -exportPath .build/export \
          -exportOptionsPlist .build/ExportOptions.plist \
          -allowProvisioningUpdates \
          ${ASC_KEY_PATH:+-authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"}

  # The two above, behind the rule that keeps TestFlight's versions honest. The
  # build number is the commit count, so archiving off an untagged commit ships
  # a second "1.12.1" that isn't 1.12.1, and TestFlight lists the two side by
  # side with nothing to tell them apart. Building only at a tag is what makes
  # the version in TestFlight mean the same thing as the version on GitHub.
  ios:release:
    desc: Cut a TestFlight build from the release tag at HEAD (archive, validate, upload, then wait for Apple)
    preconditions:
      - sh: git describe --exact-match --match 'v*' --tags HEAD >/dev/null 2>&1
        msg: >-
          HEAD is not a release tag. The app's version is the repo's
          release-please tag, so build from one (fetch the tags, then check out
          vX.Y.Z). For a deliberate off-tag build, run ios:archive and
          ios:upload.
      # The archive is built from the working tree, not from the tag object, so
      # a dirty tree at a tag uploads something that is not what the tag names.
      - sh: test -z "$(git status --porcelain)"
        msg: "Working tree is dirty — the archive would not be the tagged commit"
    cmds:
      - task: ios:archive
      - task: ios:validate
      - task: ios:upload
      # Apple takes 5-15 minutes to process an upload; this ends the release
      # with the verdict instead of a reminder to come back and check.
      - ./scripts/asc-builds.py --wait

  ios:verify:
    desc: Ask App Store Connect whether the newest release tag has an installable build (-- --wait polls until it does)
    cmds:
      - ./scripts/asc-builds.py {{.CLI_ARGS}}

  ios:screenshots:
    desc: Build for the simulator and screenshot the store's screens on an iPhone and an iPad into app/.build/screenshots
    cmds:
      # The store build's compilation conditions, plus DEBUG for the launch
      # arguments the script drives it with: no TWITCH, so no Twitch section
      # in Settings (see Guessr.xcconfig).
      - task: ios:build
        vars:
          SETTINGS: SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG
      - ./scripts/ios-screenshots.sh

  asc:listing:
    desc: Write app/store.toml into App Store Connect's listing -- text, category, age rating, build, review details, screenshots (-- --apply to write; plans by default)
    cmds:
      - ./scripts/asc-listing.py {{.CLI_ARGS}}

  gamecenter:images:
    desc: Render the Game Center achievement images into app/.build/achievements for gamecenter:config to upload
    cmds:
      - ./scripts/make-achievement-images.sh

  gamecenter:config:
    desc: Create the Game Center leaderboards and achievements the server submits to in App Store Connect (-- --apply to write; plans by default)
    cmds:
      - ./scripts/gamecenter-config.py {{.CLI_ARGS}}

  # The same name as tempomat's, which fans out to iPhone, Apple TV and Mac;
  # the app here is one iPhone-and-iPad build, so it is ios:release.
  release:all:
    desc: Cut TestFlight builds for every platform from the release tag at HEAD
    cmds:
      - task: ios:release

  # "Did 1.12.1 go out?" has three answers — the GitHub release, the production
  # deploy and the TestFlight build — so the honest answer reads all three.
  release:status:
    desc: 'Where the newest release tag got to: GitHub release, production deploy, TestFlight build'
    silent: true
    cmds:
      - |
        set -u
        git fetch -q --tags origin
        tag=$(git describe --tags --abbrev=0 origin/main)
        printf 'tag         %s (%s)\n' "$tag" "$(git rev-parse --short "$tag")"
        printf 'release     %s\n' "$(gh release view "$tag" \
          --json isDraft,publishedAt \
          --jq 'if .isDraft then "draft — not published" else "published " + .publishedAt end' 2>&1)"
        printf 'deploy      %s\n' "$(gh run list -w release.yml -b "$tag" \
          --json status,conclusion \
          --jq 'if length == 0 then "no release run for this tag" else .[0].conclusion // .[0].status end' 2>&1)"
        printf 'testflight\n'
      # Its own command so its exit code is the task's: non-zero means the tag
      # has no installable build.
      - ./scripts/asc-builds.py
