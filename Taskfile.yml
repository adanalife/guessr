# Taskfile for the guessing game.
#
# The game is static files. `rounds` does all the work up front — it needs the
# dashcam corpus mounted and kubectl access to the tripbot Postgres — and
# everything after that is a plain directory of HTML, JS and JPEGs.

version: '3'

vars:
  PORT: '{{.PORT | default "8000"}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  rounds:
    desc: Build a round set (scores clips for locatability, extracts frames)
    cmds:
      - python3 make_rounds.py {{.CLI_ARGS}}

  check:
    desc: Validate the generated round set
    cmds:
      - python3 check.py

  serve:
    desc: Serve the game locally on $PORT (binds all interfaces, so a phone on
      the tailnet can reach it)
    cmds:
      - python3 -m http.server -d web {{.PORT}}

  test:
    desc: Run the tests that need no corpus or database (daily draw, frame zoom,
      frame dimensions, round-set swap, seeding)
    cmds:
      - node test_daily.js
      - node test_zoom.js
      - python3 test_check.py
      - python3 test_swap.py
      - python3 test_seed.py

  build:
    desc: Generate a fresh round set and validate it
    cmds:
      - task: rounds
      - task: check
