version: 2
updates:
  # Keeps the workflow action pins current; the repo has no package manifest
  # (the scripts are stdlib-only), so there is no second ecosystem to watch.
  #
  # Minor and patch bumps batch into one PR per ecosystem. A major is left out
  # of every group so a breaking change arrives on its own, attributable to a
  # single dependency instead of hiding among a dozen safe ones. Security
  # updates ignore groups entirely and always arrive alone.
  #
  # Bumps carry no user-facing change, so they never need a towncrier changelog
  # fragment — which matters more here than in most repos, because this one's
  # fragments are written for players and a version bump is nothing a player can
  # see. Self-apply skip-changelog so the changelog gate's existing label escape
  # hatch exempts them, keeping that workflow bot-agnostic. Note: setting
  # `labels` replaces Dependabot's defaults, so the otherwise-automatic
  # dependencies/ecosystem labels are restated here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github_actions
      - skip-changelog
