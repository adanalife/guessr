name: release
# Production deploy to guessr.dana.lol at a release tag.
#
# main deploys to staging on every merge (staging.yml); production only moves
# when the standing release PR is merged, so the live game is always a version
# with a changelog entry rather than whatever landed last.
#
# Production runs the Python API the same way staging does: the Worker deploys
# first, and the Pages project's `API` service binding (set by hand in the
# dashboard) decides whether the site's /api/, /admin/ and /clips/ reach it.
# Without the binding the Worker sits idle and the JS Functions keep answering.
#
# Unlike staging, the Worker never takes players' traffic until it has proved
# itself: `worker` uploads the new version and deploys it at 0% beside the one
# serving, `colos` reads it from a spread of runners (which land in several
# Cloudflare colos), and only then does `deploy` move it to 100%. A version that
# fails either gate never serves anyone; `restore` takes the 0% version back
# out, so production is left exactly as it was, and the run goes red.
on:
  push:
    tags:
      - v*
  # A manual re-deploy of an existing tag, for when the push-triggered run
  # failed on something outside the code (a Cloudflare hiccup, an expired
  # token). Pick the tag as the ref.
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would each take the other's version for the serving one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  WORKER: adanalife-guessr-api

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      serving: ${{ steps.stage.outputs.serving }}
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A deploy whose migrations are not applied serves handlers that read
      # tables the database lacks, and every such route 500s until someone runs
      # the apply. The ledger already knows -- this is the same read
      # `task schema:prod:status` runs -- so this step fails on it.
      #
      # Before the deploy, not after: applying is a laptop command by design
      # (the README says why migrations are never automated), so the useful
      # shape is to leave the old build serving and re-run this job once the
      # database has caught up. Afterwards would only narrate the breakage.
      #
      # Greps the wording because `d1 migrations list` exits 0 whether or not
      # anything is pending. If wrangler ever rephrases it this goes red on a
      # database that is fine, which is the direction worth being wrong in.
      - name: Check the production D1 has every migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations list adanalife-guessr-answers --remote \
            --config wrangler.d1.jsonc 2>&1 | tee /tmp/migrations.txt
          grep -q 'No migrations to apply' /tmp/migrations.txt || {
            echo "::error::the production database is behind — run 'task schema:prod:apply', then re-run this job"
            exit 1
          }
      # Node from .tool-versions rather than the runner's: pywrangler builds its
      # Pyodide environment with a node flag that Node 26 dropped.
      # Both caches off: this job deploys to production with the Cloudflare
      # token in hand, so a poisoned cache entry would be restored straight into
      # the release path. A cold install is the cheaper risk.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag published
        with:
          enable-cache: false
      # pywrangler vendors the Python packages (its `sync`) before handing the
      # upload to wrangler; the bundle is the server package it uploads. The
      # memory snapshot a Python Worker's isolates restore from is taken at
      # upload, so the 0% version starts exactly the way it will at 100%.
      #
      # `serving` is written before anything changes, so `restore` has it even
      # when the upload is what failed.
      - name: Stage the Python Worker at 0% (production)
        id: stage
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          serving=$(npx --yes wrangler deployments status --name "$WORKER" --json |
            jq -r '.versions[] | select(.percentage == 100) | .version_id')
          [ -n "$serving" ] || { echo "::error::no version of $WORKER serves 100% -- settle the split by hand first"; exit 1; }
          echo "serving=$serving" >> "$GITHUB_OUTPUT"
          ./scripts/api-bundle.sh
          cd api
          uv sync
          uv run pywrangler versions upload --env production --message "$GITHUB_REF_NAME" | tee /tmp/upload.txt
          staged=$(sed -n 's/^Worker Version ID: //p' /tmp/upload.txt)
          [ -n "$staged" ] || { echo "::error::the upload printed no version id"; exit 1; }
          echo "staged=$staged" >> "$GITHUB_OUTPUT"
          npx --yes wrangler versions deploy "$staged@0%" "$serving@100%" --name "$WORKER" \
            --message "$GITHUB_REF_NAME staged" -y
      # The same guard staging.yml runs, aimed at the staged version: one whose
      # memory snapshot came up bad answers 500 from every cold isolate, and on
      # prod that would be players' scores failing to post. The action says the
      # rest.
      - name: Prove the Worker's cold isolates start
        uses: ./.github/actions/worker-cold-start
        with:
          base: https://adanalife-guessr.pages.dev
          override: ${{ env.WORKER }}="${{ steps.stage.outputs.staged }}"

  # The bad version of 2026-10-02 failed ~40% of requests in Boston's colo while
  # the single runner's colo, and three synthetic probes elsewhere, read it
  # fine. A GitHub-hosted job lands in whichever Azure region has room, so six
  # of them spread over several colos; the notice each prints names its colo.
  colos:
    needs: worker
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
        n: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/worker-cold-start
        with:
          base: https://adanalife-guessr.pages.dev
          override: ${{ env.WORKER }}="${{ needs.worker.outputs.staged }}"

  deploy:
    needs: [worker, colos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false
      # Cloudflare answers an override for a version outside the deployment
      # with the serving version, so the gates above only count if the split
      # they read is still the one `worker` made.
      - name: Promote the staged Worker to 100% (production)
        id: promote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERVING: ${{ needs.worker.outputs.serving }}
          STAGED: ${{ needs.worker.outputs.staged }}
        run: |
          split=$(npx --yes wrangler deployments status --name "$WORKER" --json |
            jq -c '[.versions[] | [.version_id, .percentage]] | sort')
          want=$(jq -nc --arg s "$SERVING" --arg n "$STAGED" '[[$n, 0], [$s, 100]] | sort')
          [ "$split" = "$want" ] || { echo "::error::the deployment changed under the gates: $split"; exit 1; }
          npx --yes wrangler versions deploy "$STAGED@100%" --name "$WORKER" --message "$GITHUB_REF_NAME" -y
          echo "promoted=true" >> "$GITHUB_OUTPUT"
      # web/version.json is what the page's About panel reads to say which
      # build it is. The panel links the changelog on GitHub rather than
      # shipping a copy, so there is nothing else to stamp.
      - name: Stamp the build
        run: |
          printf '{"label":"%s","tier":"production"}\n' "$GITHUB_REF_NAME" > web/version.json
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Tag checkouts have detached HEAD; --branch names the Pages project's
        # production branch ("main", set in infra's terraform and independent
        # of any git branch), which is the alias serving guessr.dana.lol.
        run: npx wrangler pages deploy web/ --project-name adanalife-guessr --branch main
      # smoke.sh measures the served clip to prove the HUD crop applied, and the
      # runner image carries no ffmpeg. A cached static build is a few seconds;
      # apt would pull the whole media stack for the one binary this needs.
      - uses: AnimMouse/setup-ffmpeg@v1

      # The tier this matters most on. A release carrying a new round set scores
      # nothing until `task answers:prod:push` runs, and nothing but memory
      # couples the two — v0.5.0 went live minutes before its seed and very
      # likely served an unscoreable game meanwhile. Red here says so; nothing
      # else does.
      #
      # Against pages.dev rather than guessr.dana.lol: a custom domain serves the
      # previous build for up to a minute after a green deploy, which would
      # smoke-test the thing that just got replaced.
      #
      # It fails *after* the deploy, which is the honest shape — a Pages deploy
      # can't be gated on a check that needs it live. Fix forward: push the
      # answers, then re-run the job.
      - name: Smoke-test the endpoints
        run: ./smoke.sh https://adanalife-guessr.pages.dev
      # Two notifications, two channels, and the split is the point: an
      # announcement is for people and an alert is for whoever has to fix it.
      # One webhook is one channel, so telling them apart needs two secrets --
      # there is no per-message routing.
      #
      # `DISCORD_WEBHOOK` is the fleet-wide name, and in every other repo that
      # has it it carries exactly this: the release announcement. Keeping that
      # meaning here means the alert channel is what gets the new name, rather
      # than seven repos quietly pointing at a different channel than their
      # name suggests.
      #
      # Both are best-effort. A rotated webhook 404s, and neither a shipped
      # release nor a failure it was meant to report should turn into a second
      # failure about the notification.
      #
      # Only the tag push announces. A workflow_dispatch run re-deploys a tag
      # that already shipped, which is operational rather than news -- v1.2.0
      # announced itself three times that way. The alert below stays
      # unconditional: a re-deploy going red is exactly the case worth paging on.
      - name: Discord notification
        if: github.event_name == 'push'
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION_TAG: ${{ github.ref_name }}
        with:
          # Link the tagged CHANGELOG.md rather than a commit range. The notes
          # are what a release is to anyone reading this channel; a compare URL
          # is a list of subject lines addressed to whoever wrote them.
          #
          # One wording fleet-wide, so a release reads the same whichever repo
          # it came from. The notes are publishable as-is here: towncrier's
          # fragments are written for players (towncrier.toml says so) and the
          # game's About panel already links CHANGELOG.md.
          args: 'New release for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}): [{{ VERSION_TAG }}]({{ EVENT_PAYLOAD.repository.html_url }}/blob/{{ VERSION_TAG }}/CHANGELOG.md)'

  # Whatever went red, in any job above. A version that never reached 100% is
  # taken back out of the deployment, leaving the one that was serving alone at
  # 100%; one that did reach it stays, since the failure then came after the
  # Worker had proved itself (a smoke test, the Pages deploy).
  restore:
    needs: [worker, colos, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        if: needs.worker.outputs.serving != '' && needs.deploy.outputs.promoted != 'true'
        with:
          node-version: lts/*
          package-manager-cache: false
      - name: Take the staged Worker back out (production)
        if: needs.worker.outputs.serving != '' && needs.deploy.outputs.promoted != 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SERVING: ${{ needs.worker.outputs.serving }}
        run: |
          npx --yes wrangler versions deploy "$SERVING@100%" --name "$WORKER" \
            --message "$GITHUB_REF_NAME restored" -y
          echo "::error::the release did not reach players; $SERVING still serves. Re-run all jobs to upload afresh, which is the cure for a poisoned snapshot"
      # Nothing else says a production deploy went red. The release PR merges
      # green long before the tag runs, so the only record is this run's own
      # entry in a list nobody is watching at 04:00.
      #
      # Its own job, so it is the catch-all: a red in any job above reaches it,
      # and the announcement cannot trip it, since continue-on-error keeps a
      # dead webhook out of the job's status.
      - name: Alert Discord on failure
        if: always()
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          VERSION_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # The gates, the deploy and the smoke test can each be what failed,
          # so the message points at the log rather than
          # claiming which -- and claims nothing about what the site is serving.
          # That distinction is not academic here: v1.0.0's run went red on a
          # smoke test racing its own deploy, while the site was fine.
          args: 'Release failed for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}) at {{ VERSION_TAG }}: [run log]({{ RUN_URL }})'
