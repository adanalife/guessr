name: release
# Production deploy to guessr.dana.lol at a release tag.
#
# main deploys to staging on every merge (staging.yml); production only moves
# when the standing release PR is merged, so the live game is always a version
# with a changelog entry rather than whatever landed last.
on:
  push:
    tags:
      - v*
  # A manual re-deploy of an existing tag, for when the push-triggered run
  # failed on something outside the code (a Cloudflare hiccup, an expired
  # token). Pick the tag as the ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # web/version.json is what the page's About panel reads to say which
      # build it is. The panel links the changelog on GitHub rather than
      # shipping a copy, so there is nothing else to stamp.
      - name: Stamp the build
        run: |
          printf '{"label":"%s","tier":"production"}\n' "$GITHUB_REF_NAME" > web/version.json
      # The round-set media, which git does not carry: a set is ~150 MB of mp4
      # and this repo is public. clips.sh keys the object on a hash of the
      # committed manifest, so this can only ever pull the clips that were
      # pushed alongside the rounds.json being deployed -- and fails loudly
      # rather than deploying a game of black panes if they never were.
      - name: Pull the round-set clips from R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./clips.sh pull
      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Tag checkouts have detached HEAD; --branch names the Pages project's
        # production branch ("main", set in infra's terraform and independent
        # of any git branch), which is the alias serving guessr.dana.lol.
        run: npx wrangler pages deploy web/ --project-name adanalife-guessr --branch main
      # smoke.sh measures the served clip to prove the HUD crop applied, and the
      # runner image carries no ffmpeg. A cached static build is a few seconds;
      # apt would pull the whole media stack for the one binary this needs.
      - uses: AnimMouse/setup-ffmpeg@v1

      # The tier this matters most on. A release carrying a new round set scores
      # nothing until `task answers:prod:push` runs, and nothing but memory
      # couples the two — v0.5.0 went live minutes before its seed and very
      # likely served an unscoreable game meanwhile. Red here says so; nothing
      # else does.
      #
      # Against pages.dev rather than guessr.dana.lol: a custom domain serves the
      # previous build for up to a minute after a green deploy, which would
      # smoke-test the thing that just got replaced.
      #
      # It fails *after* the deploy, which is the honest shape — a Pages deploy
      # can't be gated on a check that needs it live. Fix forward: push the
      # answers, then re-run the job.
      - name: Smoke-test the endpoints
        run: ./smoke.sh https://adanalife-guessr.pages.dev
      # Two notifications, two channels, and the split is the point: an
      # announcement is for people and an alert is for whoever has to fix it.
      # One webhook is one channel, so telling them apart needs two secrets --
      # there is no per-message routing.
      #
      # `DISCORD_WEBHOOK` is the fleet-wide name, and in every other repo that
      # has it it carries exactly this: the release announcement. Keeping that
      # meaning here means the alert channel is what gets the new name, rather
      # than seven repos quietly pointing at a different channel than their
      # name suggests.
      #
      # Both are best-effort. A rotated webhook 404s, and neither a shipped
      # release nor a failure it was meant to report should turn into a second
      # failure about the notification.
      - name: Discord notification
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION_TAG: ${{ github.ref_name }}
        with:
          # Link the tagged CHANGELOG.md, not a payload `compare` URL: releases
          # dispatch via workflow_dispatch, whose event payload has no `compare`.
          #
          # One wording fleet-wide, so a release reads the same whichever repo
          # it came from. The notes are publishable as-is here: towncrier's
          # fragments are written for players (towncrier.toml says so) and the
          # game's About panel already links CHANGELOG.md.
          args: 'New release for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}): [{{ VERSION_TAG }}]({{ EVENT_PAYLOAD.repository.html_url }}/blob/{{ VERSION_TAG }}/CHANGELOG.md)'
      # Nothing else says a production deploy went red. The release PR merges
      # green long before the tag runs, so the only record is this run's own
      # entry in a list nobody is watching at 04:00.
      #
      # Last, so it is the catch-all: the announcement above cannot trip it,
      # since continue-on-error keeps a dead webhook out of the job's status.
      - name: Alert Discord on failure
        if: failure()
        continue-on-error: true
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          VERSION_TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # The deploy and the smoke test both live in this job and either can
          # be what failed, so the message points at the log rather than
          # claiming which -- and claims nothing about what the site is serving.
          # That distinction is not academic here: v1.0.0's run went red on a
          # smoke test racing its own deploy, while the site was fine.
          args: 'Release failed for [{{ EVENT_PAYLOAD.repository.full_name }}]({{ EVENT_PAYLOAD.repository.html_url }}) at {{ VERSION_TAG }}: [run log]({{ RUN_URL }})'
