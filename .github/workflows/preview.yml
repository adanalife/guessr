name: preview
# A URL to look at before merging, one per pull request.
#
# The Pages projects are Direct Upload, which gets none of the automatic
# preview deploys the Cloudflare→GitHub integration provides — so without this
# workflow the earliest a change can be seen is after it lands on staging,
# which is to say after it is merged. Nearly every change here is visual (a
# regenerated round set is 27 MB of JPEGs no diff view can show), so a
# reviewable URL is the review.
#
# The deploy goes into the *staging* Pages project on a branch alias, not a
# third project: an alias is free, and adding a project is terraform in the
# infra repo. Only the project's production branch ("main") serves
# stage.guessr.dana.lol, so a per-branch alias can't disturb it.
on:
  # Every PR, whatever it targets: a PR stacked on another feature branch is the
  # one that most needs a URL, since its diff is against a branch nobody has
  # looked at rather than against main. Aliases are free.
  pull_request:

permissions:
  contents: read
  # The sticky comment edits the PR conversation in place.
  pull-requests: write

# A force-push should supersede its own earlier deploy rather than race it —
# whichever upload finished last would otherwise be what the alias serves.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub withholds repo secrets from fork-triggered and Dependabot-triggered
    # runs, so CLOUDFLARE_API_TOKEN would arrive blank and wrangler would fail
    # red on a PR whose author can do nothing about it. Skipping the whole job
    # reports neutral instead. The fix is NOT pull_request_target: that runs
    # with secrets against unreviewed head code in a public repo. A fork PR
    # gets its preview once a maintainer pushes the branch here.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
      # web/version.json is what the page's About panel reads to say which
      # build it is. A preview names the PR and its head commit, so a stale
      # tab is obvious. GITHUB_SHA on a pull_request event is the ephemeral
      # merge commit, hence the head sha from the event payload instead.
      - name: Stamp the build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{"label":"PR #%s@%s","tier":"preview"}\n' \
            "${{ github.event.pull_request.number }}" \
            "${HEAD_SHA::7}" \
            > web/version.json
      # No build step: web/ is the site, round set included. `wrangler pages
      # deploy` uploads only the files whose hashes Cloudflare doesn't already
      # hold, so the frames transfer once across all previews, not per deploy.
      - name: Deploy to Cloudflare Pages (preview alias)
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Pass the branch through the environment rather than interpolating it
          # into the script, so a crafted branch name can't inject shell.
          HEAD_REF: ${{ github.head_ref }}
        # Read the alias out of wrangler's own output. Cloudflare truncates a
        # branch alias to 28 characters and rewrites the slashes, so a URL
        # built by concatenating the branch name is wrong for most branches
        # here. An empty capture fails the step rather than posting a comment
        # with a blank link.
        run: |
          set -o pipefail
          npx wrangler pages deploy web/ \
            --project-name adanalife-guessr-staging \
            --branch "$HEAD_REF" | tee wrangler.out
          alias=$(grep 'alias URL:' wrangler.out | grep -oE 'https://[^[:space:]]+' | tail -1)
          test -n "$alias"
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      # The endpoints, against the deployment that will actually serve them.
      # Everything below the handler is untestable anywhere else: the unit tests
      # cover the scoring curve and the draw, but the D1 bindings, the Pages
      # routing and the cross-directory bundling of web/daily.js only exist in a
      # real deploy.
      #
      # It also guards the failure the README warns about and nothing enforced —
      # a regenerated round set whose answers were never pushed to D1, where
      # every guess comes back "unknown round" on a deploy that looked green.
      # And a missing table from an unapplied schema.sql surfaces here as a 500
      # rather than on the stream.
      #
      # Read-only by construction: a practice guess (no date) is scored and
      # never recorded, and the two rejections never reach the write path. So
      # this leaves nothing behind in the staging database to clean up.
      - name: Smoke-test the endpoints
        env:
          BASE: ${{ steps.deploy.outputs.alias }}
        run: |
          set -euo pipefail

          # Every request goes through here, and it retries only while the
          # answer is the *site* rather than a Function -- a body starting `<`
          # is the game's HTML, which is what Pages serves for a path no Worker
          # claims. That is the propagation signature: an alias serves static
          # assets from the edge before the Worker routing for the deployment is
          # live, so a request lands on the site and 404s. Retrying a
          # not-the-Function answer costs a couple of seconds; retrying a real
          # JSON answer would hide exactly the failures this step exists to
          # catch, so it never does.
          call() {
            local out
            for _ in $(seq 1 20); do
              out=$(curl -s -w '\n%{http_code}' "$@")
              if ! grep -q '^<' <<<"$out"; then printf '%s' "$out"; return 0; fi
              sleep 3
            done
            printf '%s' "$out"
          }

          # Wait on a Function, not on a static asset: rounds.json can be served
          # from the edge while /api/* still misses, which is how a green deploy
          # produced an HTML 404 mid-run. The unknown-board 400 is the cheapest
          # deterministic Function response there is, and touches no database.
          for _ in $(seq 1 30); do
            if curl -s "$BASE/api/leaderboard?board=weekly" | grep -q '"error"'; then break; fi
            sleep 3
          done

          check() { # name, expected status, actual status, body
            if [ "$2" != "$3" ]; then
              echo "::error::$1 expected HTTP $2, got $3: $4"
              exit 1
            fi
            echo "ok: $1 -> $3"
          }

          post() { call -X POST "$BASE/api/score" \
            -H 'content-type: application/json' -d "$1"; }

          image=$(curl -sf "$BASE/rounds.json" | jq -r '.[0].image')

          # A practice guess: scored, never recorded. Fails if the answers table
          # has never heard of the round set that just deployed.
          out=$(post "{\"image\":\"$image\",\"lat\":40,\"lng\":-100}")
          check "practice guess scores" 200 "$(tail -1 <<<"$out")" "$(head -1 <<<"$out")"
          grep -q '"recorded":false' <<<"$out" || { echo "::error::practice guess was recorded"; exit 1; }

          # A round nobody has answers for.
          out=$(post '{"image":"frames/not-a-real-frame.jpg","lat":40,"lng":-100}')
          check "unknown round is refused" 404 "$(tail -1 <<<"$out")" "$(head -1 <<<"$out")"

          # A date far enough out that no clock skew makes it open, so the
          # window check is what refuses it.
          out=$(post "{\"image\":\"$image\",\"lat\":40,\"lng\":-100,\"date\":\"2099-01-01\",\"player_id\":\"ci-smoke\"}")
          check "a closed date is refused" 403 "$(tail -1 <<<"$out")" "$(head -1 <<<"$out")"

          # Both boards read. A 500 here is an unapplied schema.sql.
          #
          # The shape assertion is not belt-and-braces: Pages serves the static
          # site for a path no Function claims, so a missing endpoint answers
          # 200 with the game's HTML and a status-only check sails past it.
          for board in daily monthly; do
            out=$(call "$BASE/api/leaderboard?board=$board")
            check "$board board reads" 200 "$(tail -1 <<<"$out")" "$(head -1 <<<"$out")"
            grep -q '"rows"' <<<"$out" || { echo "::error::$board board had no rows key"; exit 1; }
          done

          out=$(call "$BASE/api/leaderboard?board=weekly")
          check "an unknown board is refused" 400 "$(tail -1 <<<"$out")" "$(head -1 <<<"$out")"

      - name: Sticky preview URL comment
        # Posted even when the smoke test fails: that is exactly when someone
        # wants the URL to go and look.
        if: always() && steps.deploy.outputs.alias != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          # A stable header makes the action edit its previous comment instead
          # of adding one per push.
          header: cf-preview
          message: |
            🔭 **Preview:** ${{ steps.deploy.outputs.alias }}
