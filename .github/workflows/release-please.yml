name: release-please
# Trunk-based release flow: release-please maintains a standing release PR on
# main (the next version, computed from the conventional commits since the last
# release). Merging that PR creates the vX.Y.Z tag + GitHub Release, and the tag
# fires release.yml — which is what promotes staging to guessr.dana.lol.
#
# `skip-changelog` is set because towncrier owns CHANGELOG.md: the "Build the
# changelog" step below collates the changelog.d/ fragments on the release PR
# branch, so the player-facing notes land atomically with the version bump when
# the PR squash-merges. Release-please's own changelog is a list of commit
# subjects, which is the wrong register for a file the About panel links to.
#
# It runs on the adanalife-automation app token, not GITHUB_TOKEN, and both
# halves of that matter. Anything github-actions[bot] triggers is held at
# `action_required` under the repo's first-time-contributor approval policy —
# a status the bot never outgrows — so an update to the release PR branch would
# park `gates` and `pre-commit` unrun and leave the PR BLOCKED until someone
# clicked approve, three workflows at a time. And a GITHUB_TOKEN-pushed tag
# fires no push trigger at all, so release.yml would need dispatching by hand.
# An app token is an ordinary actor on both counts: its pull_request events run
# unheld and its tag reaches release.yml on its own.
on:
  push:
    branches:
      - main

# Every write goes through the app token below; the job's own GITHUB_TOKEN
# needs nothing.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint automation app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # Without these the token carries the app installation's whole
          # permission set. release-please needs exactly two: contents to push
          # the branch and cut the tag, pull-requests to maintain the release PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # On the standing-release-PR run (not the release-created run), collate
      # the fragments onto the PR branch. Pushed with the app token so the push
      # fires the PR's pull_request events and the gates re-run against the
      # final release state. release-please recreates this branch from main on
      # every push, so the rebuild is idempotent.
      - name: Check out the release PR branch
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        # zizmor: ignore[artipacked] the push at the end of this job is what
        # the persisted credential is for
        uses: actions/checkout@v7
        with:
          ref: release-please--branches--main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@v10.0.1 # no floating major tag published
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        with:
          # This job holds a write token and publishes a tag, so a poisoned
          # cache entry would be restored straight into the release path. The
          # one `uvx towncrier` call below is not worth that exposure.
          enable-cache: false

      - name: Build the changelog on the release PR branch
        if: ${{ steps.release.outputs.pr && !steps.release.outputs.release_created }}
        run: |
          set -euo pipefail
          # release-please bumped the manifest on this branch — that version is
          # the single source of truth for both the changelog stanza and the
          # tag that gets cut.
          VERSION=$(jq -r '."."' .release-please-manifest.json)
          echo "Release version: $VERSION"

          # A fragment still named "+<slug>.<type>.md" here missed its PR-time
          # rename: changelog-number.yml checks out the head branch, and a merge
          # that lands while that job is queued deletes the branch out from under
          # it. The squash commit that put the fragment on main carries the PR
          # number in its subject, so recover it from there — this is the last
          # moment before towncrier turns fragments into permanent changelog
          # lines, and it needs no branch to still exist.
          for f in changelog.d/+*.md; do
            [ -e "$f" ] || continue
            subject="$(git log --diff-filter=A --format=%s -1 -- "$f")"
            pr="$(printf '%s' "$subject" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')"
            if [ -z "$pr" ]; then
              echo "::warning title=Unnumbered changelog fragment::${f} has no PR number in the commit that added it (\"${subject}\") — its entry will publish without a link."
              continue
            fi
            base="$(basename "$f" .md)"
            type="${base##*.}"
            # `towncrier create` de-duplicates its own output by appending a
            # counter before .md, so a second +behind.behind.md arrives as
            # +behind.behind.1.md and the last segment is that counter rather
            # than the type. Read as the type it produces <PR>.1.md, a name
            # towncrier rejects.
            case "$type" in
              *[!0-9]*) ;;                        # a real type, not a counter
              *) stem="${base%.*}"; type="${stem##*.}" ;;
            esac
            target="changelog.d/${pr}.${type}.md"
            n=0
            while [ -e "$target" ]; do
              n=$((n + 1))
              target="changelog.d/${pr}.${type}.${n}.md"
            done
            echo "::notice title=Recovered changelog fragment::${f} -> ${target} (from #${pr})."
            git mv "$f" "$target"
          done

          # A release PR can legitimately carry no fragments (a fix: whose entry
          # was skip-changelog'd), which is no stanza rather than an error.
          if compgen -G "changelog.d/*.md" > /dev/null; then
            uvx towncrier build --yes --config towncrier.toml --version "$VERSION"
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: build changelog for $VERSION"
            git push origin HEAD:release-please--branches--main
          fi
