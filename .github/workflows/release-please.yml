name: release-please
# Trunk-based release flow: release-please maintains a standing release PR on
# main (version + CHANGELOG computed from conventional commits). Merging that
# PR creates the vX.Y.Z tag + GitHub Release.
#
# There is no release.yml to dispatch yet: nothing here is deployed, so a tag is
# just a marked point in the CHANGELOG. The reason release-please is wired up
# before a deploy target exists is that it accumulates the changelog from the
# first commit, and that history can't be reconstructed later.
on:
  push:
    branches:
      - main

permissions:
  contents: write # tag + GitHub Release + release-PR branch
  pull-requests: write # open/update the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
