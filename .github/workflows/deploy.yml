name: deploy
# Every merge to main goes live at guessr.dana.lol.
#
# One Cloudflare Pages project ("adanalife-guessr", declared in infra's
# terraform/prod-1/cloudflare-pages-guessr.tf), so unlike the blog there is no
# staging project to land on first — main IS production. That's affordable
# here because the game is static files with no backend and no data to
# corrupt; pr-gates validates the round set before anything merges.
#
# Release tags are not a deploy trigger. release-please tags a point in the
# CHANGELOG; the deployed content is whatever main holds.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges close together would race, and the older deploy finishing last
# would leave the site on stale content.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No build step: web/ is the site, round set included. `wrangler pages
      # deploy` uploads only the files whose hashes Cloudflare doesn't already
      # hold, so the 27 MB of frames transfers once, not on every deploy.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --branch names the Pages project's production branch ("main", set in
        # infra's terraform and independent of any git branch), which is the
        # alias serving guessr.dana.lol.
        run: npx wrangler pages deploy web/ --project-name adanalife-guessr --branch main
