name: vendor-freshness

# Guards the third-party frontend assets vendored under web/, and pinned in
# vendor.txt: Leaflet and the et-book fonts.
# The check and the freshness report live in adanalife/infra's vendor.yml.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vendor-freshness:
    uses: adanalife/infra/.github/workflows/vendor.yml@main
