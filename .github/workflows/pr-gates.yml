# The fast per-PR gates, in one job.
#
# Fleet convention: every adanalife repo runs its cheap per-PR checks as steps
# of one `gates` job here, because GitHub bills Actions per job rounded up to
# the whole minute. Five checks in one job is four minutes of billing saved per
# PR, and a sixth is a step to add rather than a workflow (and a required-check
# rename) to introduce.
#
# `gates` always reports, even when an individual step is inapplicable, so it is
# safe to mark required in branch protection — a path-filtered *workflow* would
# hang as "Expected" and block merges instead.
name: pr-gates

on:
  pull_request:
    # Every PR, whatever it targets. Filtering to `branches: [main]` would leave
    # a PR stacked on another feature branch running no tests at all — the review
    # that most wants them, since it is looking at the top of a stack rather than
    # at a diff against main.
    #
    # `edited` is what makes the title check re-run when a title is fixed;
    # `labeled`/`unlabeled` the same for the skip-changelog escape hatch.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `gates` is the required-status-check name in this repo's protect-main
  # ruleset. Renaming this job means updating the ruleset in the same change,
  # or every subsequent PR hangs on a check that can never report.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Conventional Commits enforcement for the SQUASH SUBJECT. The commit-msg
      # pre-commit hook only guards local commits; because PRs squash-merge, the
      # PR *title* becomes the commit subject written to history.
      #
      # release-please's standing release PR is titled `chore(main): release
      # X.Y.Z`, itself a conventional subject, so it passes with no exemption.
      - name: Conventional PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # fetch-depth: 0 so the changelog gate below can diff against the base
      # branch; nothing else here needs history.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      # The node tests: the daily-round draw, the frame-pane viewport math, the
      # scoring curve plus the validator on /api/score, the leaderboard boards,
      # the generated aliases and the device merge. All sub-second and needing no
      # corpus or database, which is why they belong here as a step rather than a
      # job.
      #
      # Globbed, not listed. A listed test file is one somebody has to remember
      # to add in two places, and a test nobody adds is a test that fails by
      # staying green. `|| exit 1` because a for-loop reports its last command's
      # status, so without it a failure anywhere but the end passes.
      - name: Node tests
        run: for f in test_*.mjs; do echo "== $f"; node "$f" || exit 1; done

      - uses: actions/setup-python@v7
        with:
          python-version-file: .tool-versions

      # Nothing here validates a round set, and the absence is deliberate rather
      # than an oversight: a set is rows in D1 and none of it reaches this repo,
      # so there is no artifact to check and no PR to hang a check on.
      #
      # Two things cover it instead. check.py runs inside publish.sh before
      # anything is pushed -- but on the generating machine's word alone. And
      # smoke.sh measures a *deployed* clip's aspect ratio against every tier,
      # which is the assertion that catches an uncropped HUD, i.e. the answer
      # printed across the footage. test_check_main.py below pins check.py's own
      # behaviour.
      #
      # Thinner than a gate over committed bytes, knowingly: it is the price of
      # taking the deploy out of publishing a round set.

      # test_check.py builds clips with ffmpeg and measures them with ffprobe,
      # and the runner image carries neither. Without this the dimension
      # assertions -- the ones standing behind the HUD-crop check -- skip
      # themselves and the step still passes green.
      - uses: AnimMouse/setup-ffmpeg@v1

      # The python tests: the clip-dimension reader behind check.py's HUD-crop
      # assertion, the swap that puts a regenerated set into place, the seeding
      # that makes a regeneration reproducible, how a round set is selected, and
      # which route scoring takes to Postgres. Sub-second, and stdlib apart from
      # the ffmpeg installed just above. Globbed for the same reason as the node
      # step above.
      - name: Python tests
        run: for f in test_*.py; do echo "== $f"; python3 "$f" || exit 1; done

      # The migrations are hand-written DDL that nothing else parses until
      # someone runs `task schema:prod:apply`, where a typo is discovered against
      # the production database. sqlite3 is D1's own engine and ships on the
      # runner, so replaying them into a scratch database costs nothing and moves
      # that discovery here.
      #
      # In filename order, which is the order wrangler applies them in, so this
      # catches a migration that only works if run before one that precedes it.
      # Once each: from 0002 onward the `d1_migrations` ledger is what guarantees
      # single application, so the DDL is bare and re-running would rightly fail.
      - name: Migrations replay in order
        run: |
          for m in migrations/*.sql; do
            echo "== $m"
            sqlite3 /tmp/schema-check.db < "$m"
          done

      # The baseline is the exception, and its exemption is load-bearing: it has
      # to be a no-op against staging and production, which were built by hand
      # before there was a ledger to record that they had been. If it stops being
      # re-runnable, adopting an existing database fails instead.
      - name: The baseline migration is idempotent
        run: |
          sqlite3 /tmp/baseline-check.db < migrations/0001_initial_schema.sql
          sqlite3 /tmp/baseline-check.db < migrations/0001_initial_schema.sql

      # And the whole game against a real local D1 -- workerd's own SQLite via
      # `wrangler --local`, and `wrangler pages dev` for the runtime. The steps
      # above prove the migrations parse; the node tests above prove the handlers'
      # logic against a stub of the binding. Neither can say whether Pages routes
      # to a handler, whether the binding is wired, or how a real D1 answers, and
      # those are the failures that have cost a deploy each: an endpoint that
      # 500s on a table nobody created reads as a perfectly green build.
      #
      # No new dependency and no service container -- wrangler is already how
      # this repo deploys. The cost is one uncached `npx wrangler` download per
      # run, because the repo has no package.json to cache against; worth adding
      # one if this step ever dominates the job.
      - name: The game runs against a real local D1
        run: ./integration.sh

      - uses: astral-sh/setup-uv@v9.0.0 # no floating major tag published

      # Require every PR to add a towncrier changelog fragment under
      # changelog.d/ (see README "Changelog"). CHANGELOG.md is linked from the
      # game's About panel, so it is read by players rather than reconstructed
      # by us at release time — this is what keeps it complete by construction.
      #
      # Escape hatch: the `skip-changelog` label, for PRs that genuinely warrant
      # no entry (dependabot bumps, a round-set regeneration, a revert).
      # release-please's own release PR is exempt by head branch — it collates
      # the fragments, it doesn't add one.
      - name: Require a changelog fragment
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.head_ref != 'release-please--branches--main' }}
        env:
          BASE: ${{ github.base_ref }}
        run: uvx towncrier check --config towncrier.toml --compare-with "origin/$BASE"
