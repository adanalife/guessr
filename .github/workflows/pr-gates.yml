# The per-PR gates: the org's reusable `gates` job (adanalife/infra,
# .github/workflows/gates.yml), configured for this repo. `tests` is the
# game's own suite: it needs node, python, ffmpeg and sqlite, which the shared
# job doesn't install.
name: pr-gates

on:
  pull_request:
    # Every PR, whatever it targets. Filtering to `branches: [main]` would leave a
    # PR stacked on another feature branch running no gates at all — the review
    # that most wants them, since its diff is against a branch nobody has looked
    # at rather than against main.
    #
    # `edited` re-runs the title check when a title is fixed; `labeled` /
    # `unlabeled` the same for the skip-changelog escape hatch.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# What the shared gates job reads: the checkout, the PR (title check), this
# run's own jobs (the failing-gate reporter) and GHCR (the pinned-tag check).
# Without a block every job here would get the repo's default token.
permissions:
  contents: read
  pull-requests: read
  actions: read
  packages: read

jobs:
  gates:
    uses: adanalife/infra/.github/workflows/gates.yml@main
    with:
      vendor-script: ./scripts/vendor.sh
      # A name in the docs is a claim about the repo, and a wrong one can reach
      # players: error bodies name tasks too. Resolves every backticked `task
      # <name>` against the Taskfile and every backticked repo-relative path
      # against the tracked files; legitimately absent names live in
      # scripts/doc-names-allow.txt with their reason.
      checks: |
        ./scripts/check-doc-names.py
        scripts/number-fragment-test.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      # The node tests: the page's own modules -- the daily-round draw, the
      # frame-pane viewport math, the generated aliases, the share string, the
      # device-link client -- and the Pages forwarder. All sub-second and needing
      # no corpus or database, which is why they belong here as a step rather
      # than a job.
      #
      # Globbed, not listed. A listed test file is one somebody has to remember
      # to add in two places, and a test nobody adds is a test that fails by
      # staying green. `|| exit 1` because a for-loop reports its last command's
      # status, so without it a failure anywhere but the end passes.
      - name: Node tests
        run: for f in test_*.mjs; do echo "== $f"; node "$f" || exit 1; done

      - uses: actions/setup-python@v7
        with:
          python-version-file: .tool-versions

      # Nothing here validates a round set, and the absence is deliberate rather
      # than an oversight: a set is rows in D1 and none of it reaches this repo,
      # so there is no artifact to check and no PR to hang a check on.
      #
      # Two things cover it instead. check.py runs inside publish.sh before
      # anything is pushed -- but on the generating machine's word alone. And
      # smoke.sh measures a *deployed* clip's aspect ratio against every tier,
      # which is the assertion that catches an uncropped HUD, i.e. the answer
      # printed across the footage. test_check_main.py below pins check.py's own
      # behaviour.
      #
      # Thinner than a gate over committed bytes, knowingly: it is the price of
      # taking the deploy out of publishing a round set.

      # test_check.py builds clips with ffmpeg and measures them with ffprobe,
      # and the runner image carries neither. Without this the dimension
      # assertions -- the ones standing behind the HUD-crop check -- skip
      # themselves and the step still passes green.
      - uses: AnimMouse/setup-ffmpeg@v1

      # The python tests: the clip-dimension reader behind check.py's HUD-crop
      # assertion, the swap that puts a regenerated set into place, the seeding
      # that makes a regeneration reproducible, how a round set is selected, and
      # which route scoring takes to Postgres. Sub-second, and stdlib apart from
      # the ffmpeg installed just above. Globbed for the same reason as the node
      # step above.
      #
      # Under uv for the one dependency the server tests need, Starlette, which
      # api/pyproject.toml declares and api/uv.lock pins.
      - uses: astral-sh/setup-uv@v10.0.1 # no floating major tag published
      - name: Python tests
        run: for f in test_*.py; do echo "== $f"; uv run --project api python "$f" || exit 1; done

      # The migrations are hand-written DDL that nothing else parses until
      # someone runs `task schema:prod:apply`, where a typo is discovered against
      # the production database. sqlite3 is D1's own engine and ships on the
      # runner, so replaying them into a scratch database costs nothing and moves
      # that discovery here.
      #
      # In filename order, which is the order wrangler applies them in, so this
      # catches a migration that only works if run before one that precedes it.
      # Once each: from 0002 onward the `d1_migrations` ledger is what guarantees
      # single application, so the DDL is bare and re-running would rightly fail.
      # wrangler tracks applied migrations by filename, so two files sharing a
      # number both apply and nothing breaks -- but the order between them is
      # then an accident of the names after the number. Two PRs written against
      # the same main both pick the next free number; whichever lands second
      # takes the one after.
      - name: Migration numbers are unique
        run: |
          dups=$(printf "%s\n" migrations/*.sql | sed -E 's|.*/([0-9]+)_.*|\1|' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate migration number(s): $dups -- renumber the later one above the current max"
            exit 1
          fi

      - name: Migrations replay in order
        run: |
          for m in migrations/*.sql; do
            echo "== $m"
            sqlite3 /tmp/schema-check.db < "$m"
          done

      # The baseline is the exception, and its exemption is load-bearing: it has
      # to be a no-op against staging and production, which were built by hand
      # before there was a ledger to record that they had been. If it stops being
      # re-runnable, adopting an existing database fails instead.
      - name: The baseline migration is idempotent
        run: |
          sqlite3 /tmp/baseline-check.db < migrations/0001_initial_schema.sql
          sqlite3 /tmp/baseline-check.db < migrations/0001_initial_schema.sql

      # And the whole game under uvicorn over a throwaway sqlite file, held to
      # contract.py: every route's statuses, shapes and guards over HTTP. The
      # steps above prove the migrations parse and the unit tests prove handler
      # logic; this is what says the app routes, migrates and answers as one --
      # an endpoint that 500s on a table nobody created reads as a perfectly
      # green build everywhere else.
      - name: The game runs under uvicorn
        run: uv run --project api python integration_uvicorn.py
