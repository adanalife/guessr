# The fast per-PR gates, in one job.
#
# Fleet convention: every adanalife repo runs its cheap per-PR checks as steps
# of one `gates` job here, because GitHub bills Actions per job rounded up to
# the whole minute. Five checks in one job is four minutes of billing saved per
# PR, and a sixth is a step to add rather than a workflow (and a required-check
# rename) to introduce.
#
# `gates` always reports, even when an individual step is inapplicable, so it is
# safe to mark required in branch protection — a path-filtered *workflow* would
# hang as "Expected" and block merges instead.
name: pr-gates

on:
  pull_request:
    # Every PR, whatever it targets. Filtering to `branches: [main]` meant a PR
    # stacked on another feature branch ran no tests at all — the review that
    # most wants them, since it is looking at the top of a stack rather than at
    # a diff against main.
    #
    # `edited` is what makes the title check re-run when a title is fixed;
    # `labeled`/`unlabeled` the same for the skip-changelog escape hatch.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # `gates` is the required-status-check name in this repo's protect-main
  # ruleset. Renaming this job means updating the ruleset in the same change,
  # or every subsequent PR hangs on a check that can never report.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Conventional Commits enforcement for the SQUASH SUBJECT. The commit-msg
      # pre-commit hook only guards local commits; because PRs squash-merge, the
      # PR *title* becomes the commit subject written to history.
      #
      # release-please's standing release PR is titled `chore(main): release
      # X.Y.Z`, itself a conventional subject, so it passes with no exemption.
      - name: Conventional PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The node tests: the daily-round draw, the frame-pane viewport math, and
      # the scoring curve plus the validator on /api/score. All sub-second and
      # needing no corpus or database, which is why they belong here as a step
      # rather than a job.
      # fetch-depth: 0 so the changelog gate below can diff against the base
      # branch; nothing else here needs history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
      - name: Node tests
        run: node test_daily.mjs && node test_zoom.js && node test_score.mjs

      - uses: actions/setup-python@v7
        with:
          python-version-file: .tool-versions

      # The round set is committed and every main merge deploys it, so a bad
      # regeneration ships. check.py is the guard that matters, on two counts: a
      # 16:9 frame means the HUD crop didn't run and the answer is printed on the
      # image, and a coordinate in rounds.json means the answer went to the
      # browser. The answers themselves aren't committed, so the cross-check that
      # every round *has* one runs at generation time, not here.
      # Stdlib-only, so there is no toolchain to install first.
      - name: Validate the round set
        run: python3 check.py

      # The python tests: the JPEG header reader check.py validates frames with,
      # the swap that puts a regenerated set into place, and the seeding that
      # makes a regeneration reproducible. All stdlib-only and sub-second.
      - name: Python tests
        run: python3 test_check.py && python3 test_swap.py && python3 test_seed.py

      # schema.sql is hand-written DDL that nothing else parses until someone
      # runs `task schema:prod:push`, where a typo is discovered against the
      # production database. sqlite3 is D1's own engine and ships on the runner,
      # so loading it into a scratch database costs nothing and moves that
      # discovery here. Idempotent by construction, hence running it twice: the
      # push targets are documented as safe to re-run.
      - name: Schema loads, twice
        run: |
          sqlite3 /tmp/schema-check.db < schema.sql
          sqlite3 /tmp/schema-check.db < schema.sql

      - uses: astral-sh/setup-uv@v8.2.0 # no floating major tag published

      # Require every PR to add a towncrier changelog fragment under
      # changelog.d/ (see README "Changelog"). CHANGELOG.md is linked from the
      # game's About panel, so it is read by players rather than reconstructed
      # by us at release time — this is what keeps it complete by construction.
      #
      # Escape hatch: the `skip-changelog` label, for PRs that genuinely warrant
      # no entry (dependabot bumps, a round-set regeneration, a revert).
      # release-please's own release PR is exempt by head branch — it collates
      # the fragments, it doesn't add one.
      - name: Require a changelog fragment
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.head_ref != 'release-please--branches--main' }}
        env:
          BASE: ${{ github.base_ref }}
        run: uvx towncrier check --config towncrier.toml --compare-with "origin/$BASE"
