name: staging
# Every merge to main goes live at stage.guessr.dana.lol.
#
# Two Cloudflare Pages projects, declared in infra's
# terraform/prod-1/cloudflare-pages-guessr.tf: main lands on the staging one,
# and guessr.dana.lol only moves when a release tag ships (release.yml).
# Staging buys somewhere to look at a change — a regenerated round set
# especially — before players see it.
#
# Staging also runs the Python API. The site stays a Pages project, and its
# root middleware (functions/_middleware.js) hands /api/, /admin/ and /clips/ to
# the Worker through the project's `API` service binding. The Worker deploys
# first, so the forwarder never points at a Worker running older code than the
# Pages build in front of it. A failed Worker deploy stops the job, so the
# Pages site never ships ahead of the API it calls.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialise, don't cancel. Two merges close together would otherwise race, and
# the older deploy finishing last would leave staging on stale content — but
# cancelling has the same failure with a worse shape: merge a few PRs inside a
# minute and GitHub cancels the whole burst, tail included, so staging sits on
# an old commit with no failed run to notice and nothing left to re-run.
# Queueing converges on the newest merge, and a 30-second upload isn't worth
# optimising away. (Tag-triggered release.yml is unguarded — releases must ship.)
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # web/version.json is what the page's About panel reads to say which
      # build it is. Staging is not a release, so it names the commit.
      - name: Stamp the build
        run: |
          printf '{"label":"main@%s","tier":"staging"}\n' "${GITHUB_SHA::7}" > web/version.json
      # A deploy whose migrations are not applied serves handlers that read
      # tables the database lacks, and every such route 500s until someone runs
      # the apply. The ledger already knows -- this is the same read
      # `task schema:stage:status` runs -- so this step fails on it.
      #
      # Before the deploy, not after: applying is a laptop command by design
      # (the README says why migrations are never automated), so the useful
      # shape is to leave the old build serving and re-run this job once the
      # database has caught up. Afterwards would only narrate the breakage.
      #
      # Greps the wording because `d1 migrations list` exits 0 whether or not
      # anything is pending. If wrangler ever rephrases it this goes red on a
      # database that is fine, which is the direction worth being wrong in.
      - name: Check the staging D1 has every migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 migrations list adanalife-guessr-answers-staging --remote \
            --config wrangler.d1.jsonc 2>&1 | tee /tmp/migrations.txt
          grep -q 'No migrations to apply' /tmp/migrations.txt || {
            echo "::error::the staging database is behind — run 'task schema:stage:apply', then re-run this job"
            exit 1
          }
      # The Worker behind the `API` binding (see the top of this file). Every
      # step here is conditional on api/wrangler.jsonc, so a checkout without it
      # deploys only the Pages site.
      #
      # Node from .tool-versions rather than the runner's: pywrangler builds its
      # Pyodide environment with a node flag that Node 26 dropped.
      - name: No Python Worker to deploy
        if: hashFiles('api/wrangler.jsonc') == ''
        run: echo "::notice::no api/wrangler.jsonc, so only the Pages site deploys"
      - uses: actions/setup-node@v7
        if: hashFiles('api/wrangler.jsonc') != ''
        with:
          node-version-file: .tool-versions
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag published
        if: hashFiles('api/wrangler.jsonc') != ''
      - name: Deploy the Python Worker (staging)
        if: hashFiles('api/wrangler.jsonc') != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # pywrangler vendors the Python packages (its `sync`) before handing the
        # deploy to wrangler; the bundle is the server package it uploads.
        run: |
          ./scripts/api-bundle.sh
          cd api
          uv sync
          uv run pywrangler deploy
      # A Python Worker restores its deploy-time memory snapshot on every cold
      # start. Now and then a deployed version comes up with a bad one: each
      # cold isolate then re-runs the whole import inside its first request,
      # blows the startup CPU budget or trips Pyodide's re-entrancy check, and
      # answers 1101 to everything until it is evicted -- ~70% of stage's calls
      # for two hours on 2026-09-30, on two versions in a row, while the same
      # code on the versions either side of them served fine. Uploading the
      # bundle again is the known cure, so that is what a failed read gets.
      #
      # Sequential reads on purpose: each one that lands on a fresh isolate is
      # a cold start, which is the only thing this is trying to provoke.
      # Through pages.dev, the same way the smoke test reaches the Worker: the
      # Pages Function's binding names the service, so the previous site build
      # still forwards to the version just deployed.
      #
      # ponytail: one runner sees one colo's isolates, so a version that is
      # poisoned only elsewhere still passes; a probe from several regions is
      # the upgrade if that ever bites.
      - name: Prove the Worker's cold isolates start
        if: hashFiles('api/wrangler.jsonc') != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd api
          url="https://adanalife-guessr-staging.pages.dev/api/day?date=$(date -u +%F)"
          for attempt in 1 2; do
            sleep 15
            failed=0
            for _ in $(seq 1 20); do
              [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 500 ] && failed=$((failed + 1))
            done
            [ "$failed" = 0 ] && exit 0
            if [ "$attempt" = 2 ]; then
              echo "::error::$failed of 20 reads still answer 500 after a redeploy -- the Worker's version is poisoned; deploy again by hand or wait for Cloudflare"
              exit 1
            fi
            echo "::warning::$failed of 20 reads answered 500 -- redeploying the Worker once"
            uv run pywrangler deploy
          done

      # No build step, and no media either: web/ is the site, and the round
      # clips are served from R2 by the Worker's /clips/ route rather than
      # deployed alongside it. So what goes up is a few hundred KB of HTML and
      # JS, and a regeneration changes nothing here.
      - name: Deploy to Cloudflare Pages (staging)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # --branch names the Pages project's production branch ("main", set in
        # infra's terraform and independent of any git branch), which is the
        # alias serving stage.guessr.dana.lol.
        run: npx wrangler pages deploy web/ --project-name adanalife-guessr-staging --branch main
      # smoke.sh measures the served clip to prove the HUD crop applied, and the
      # runner image carries no ffmpeg. A cached static build is a few seconds;
      # apt would pull the whole media stack for the one binary this needs.
      - uses: AnimMouse/setup-ffmpeg@v1

      # Nothing else couples a deploy to the answers push it needs: the deploy
      # runs here, the push runs from Dana's laptop, and a mismatch looks exactly
      # like a network error from the player's side. Same script preview.yml and
      # release.yml run.
      #
      # Against pages.dev rather than stage.guessr.dana.lol: a custom domain
      # serves the previous build for up to a minute after a green deploy, which
      # would smoke-test the thing that just got replaced.
      - name: Smoke-test the endpoints
        run: ./smoke.sh https://adanalife-guessr-staging.pages.dev
